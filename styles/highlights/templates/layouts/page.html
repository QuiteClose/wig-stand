<t-extend template="cube:layouts/base.html">
<t-define name="head">
<script>
(function initHighlightsTheme() {
  "use strict";
  try {
    const saved = localStorage.getItem("highlights-theme");
    if (saved) {
      document.documentElement.dataset.theme = saved;
    }
  } catch (e) { /* storage unavailable */ }
}());
</script>
<link rel="stylesheet" t-var:href="document.style.css.path" />
</t-define>
<t-define name="body">
<t-include template="cube:blocks/skip-link.html" />
<t-include template="highlights:blocks/site-header.html" />
<main id="main-content" class="wrapper region flow prose">
<t-slot />
</main>
<t-include template="highlights:blocks/site-footer.html" />
</t-define>
</t-extend>
