<div class="theme-picker">
<span class="theme-picker__label">Theme</span>
<button type="button"
  data-set-theme="<t-raw name="document.style.highlights.available.$(document.style.highlights.default).light"/>"
  data-theme-mode="light"
  aria-pressed="true">Light</button>
<button type="button"
  data-set-theme="<t-raw name="document.style.highlights.available.$(document.style.highlights.default).dark"/>"
  data-theme-mode="dark"
  aria-pressed="false">Dark</button>
</div>
<script>
(function initThemePicker() {
  "use strict";

  const STORAGE_KEY = "highlights-theme";

  function getSaved() {
    try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
  }

  function saveTheme(theme) {
    try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) { /* storage unavailable */ }
  }

  function applyTheme(theme, buttons) {
    document.documentElement.dataset.theme = theme;
    buttons.forEach(function updatePressed(btn) {
      btn.setAttribute("aria-pressed", btn.dataset.setTheme === theme ? "true" : "false");
    });
  }

  const buttons = Array.from(document.querySelectorAll("[data-set-theme]"));
  const saved = getSaved();
  const lightBtn = buttons.find(function isLight(b) { return b.dataset.themeMode === "light"; });
  const initialTheme = saved || (lightBtn ? lightBtn.dataset.setTheme : "");

  if (initialTheme) {
    applyTheme(initialTheme, buttons);
  }

  buttons.forEach(function bindClick(btn) {
    btn.addEventListener("click", function applySelected() {
      applyTheme(btn.dataset.setTheme, buttons);
      saveTheme(btn.dataset.setTheme);
    });
  });

  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function onOsChange(e) {
      if (!getSaved()) {
        const preferredMode = e.matches ? "dark" : "light";
        const preferred = buttons.find(function matchMode(b) { return b.dataset.themeMode === preferredMode; });
        if (preferred) {
          applyTheme(preferred.dataset.setTheme, buttons);
        }
      }
    });
  }

}());
</script>
