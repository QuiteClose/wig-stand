meta:
  name: Spring
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Spring.toml"

palette:
  background:    "#ffffff"
  foreground:    "#4d4d4c"
  black:         "#000000"
  red:           "#ff4d83"
  green:         "#1f8c3b"
  yellow:        "#1fc95b"
  blue:          "#1dd3ee"
  magenta:       "#8959a8"
  cyan:          "#3e999f"
  white:         "#bfbfbf"
  bright-black:  "#000000"
  bright-red:    "#ff0021"
  bright-green:  "#1fc231"
  bright-yellow: "#d5b807"
  bright-blue:   "#15a9fd"
  bright-magenta: "#8959a8"
  bright-cyan:   "#3e999f"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
