meta:
  name: Sugarplum
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Sugarplum.toml"

palette:
  background:    "#111147"
  foreground:    "#db7ddd"
  black:         "#111147"
  red:           "#5ca8dc"
  green:         "#53b397"
  yellow:        "#249a84"
  blue:          "#db7ddd"
  magenta:       "#d0beee"
  cyan:          "#f9f3f9"
  white:         "#a175d4"
  bright-black:  "#44447a"
  bright-red:    "#5cb5dc"
  bright-green:  "#52deb5"
  bright-yellow: "#01f5c7"
  bright-blue:   "#fa5dfd"
  bright-magenta: "#c6a5fd"
  bright-cyan:   "#ffffff"
  bright-white:  "#b577fd"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
