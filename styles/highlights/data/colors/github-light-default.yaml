meta:
  name: GitHub Light Default
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/GitHub%20Light%20Default.toml"

palette:
  background:    "#ffffff"
  foreground:    "#1f2328"
  black:         "#24292f"
  red:           "#cf222e"
  green:         "#116329"
  yellow:        "#4d2d00"
  blue:          "#0969da"
  magenta:       "#8250df"
  cyan:          "#1b7c83"
  white:         "#6e7781"
  bright-black:  "#57606a"
  bright-red:    "#a40e26"
  bright-green:  "#1a7f37"
  bright-yellow: "#633c01"
  bright-blue:   "#218bff"
  bright-magenta: "#a475f9"
  bright-cyan:   "#3192aa"
  bright-white:  "#8c959f"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
