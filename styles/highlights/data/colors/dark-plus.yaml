meta:
  name: Dark+
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Dark%2B.toml"

palette:
  background:    "#1e1e1e"
  foreground:    "#cccccc"
  black:         "#000000"
  red:           "#cd3131"
  green:         "#0dbc79"
  yellow:        "#e5e510"
  blue:          "#2472c8"
  magenta:       "#bc3fbc"
  cyan:          "#11a8cd"
  white:         "#e5e5e5"
  bright-black:  "#666666"
  bright-red:    "#f14c4c"
  bright-green:  "#23d18b"
  bright-yellow: "#f5f543"
  bright-blue:   "#3b8eea"
  bright-magenta: "#d670d6"
  bright-cyan:   "#29b8db"
  bright-white:  "#e5e5e5"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
