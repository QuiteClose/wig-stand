meta:
  name: Karma Light Dimmed
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Karma%20Light%20Dimmed.toml"

palette:
  background:    "#f5f3f7"
  foreground:    "#1c1f24"
  black:         "#1c1f24"
  red:           "#e07a90"
  green:         "#4a9a4c"
  yellow:        "#d49a26"
  blue:          "#6688b8"
  magenta:       "#7c5ab0"
  cyan:          "#6688b8"
  white:         "#5a5860"
  bright-black:  "#999999"
  bright-red:    "#e07a90"
  bright-green:  "#4a9a4c"
  bright-yellow: "#e0a040"
  bright-blue:   "#6688b8"
  bright-magenta: "#9676d0"
  bright-cyan:   "#6688b8"
  bright-white:  "#1c1f24"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
