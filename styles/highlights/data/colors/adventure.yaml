meta:
  name: Adventure
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Adventure.toml"

palette:
  background:    "#040404"
  foreground:    "#feffff"
  black:         "#040404"
  red:           "#d84a33"
  green:         "#5da602"
  yellow:        "#eebb6e"
  blue:          "#417ab3"
  magenta:       "#e5c499"
  cyan:          "#bdcfe5"
  white:         "#dbded8"
  bright-black:  "#685656"
  bright-red:    "#d76b42"
  bright-green:  "#99b52c"
  bright-yellow: "#ffb670"
  bright-blue:   "#97d7ef"
  bright-magenta: "#aa7900"
  bright-cyan:   "#bdcfe5"
  bright-white:  "#e4d5c7"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
