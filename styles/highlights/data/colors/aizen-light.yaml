meta:
  name: Aizen Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Aizen%20Light.toml"

palette:
  background:    "#f0f2f6"
  foreground:    "#4a4d66"
  black:         "#f0f2f6"
  red:           "#d00c36"
  green:         "#3e9e28"
  yellow:        "#dd8c1a"
  blue:          "#1c64f2"
  magenta:       "#8636ec"
  cyan:          "#159096"
  white:         "#4a4d66"
  bright-black:  "#adb2bc"
  bright-red:    "#d00c36"
  bright-green:  "#3e9e28"
  bright-yellow: "#dd8c1a"
  bright-blue:   "#1c64f2"
  bright-magenta: "#8636ec"
  bright-cyan:   "#159096"
  bright-white:  "#4a4d66"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
