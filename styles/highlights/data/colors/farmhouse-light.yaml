meta:
  name: Farmhouse Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Farmhouse%20Light.toml"

palette:
  background:    "#e8e4e1"
  foreground:    "#1d2027"
  black:         "#1d2027"
  red:           "#8d0003"
  green:         "#3a7d00"
  yellow:        "#a95600"
  blue:          "#092ccd"
  magenta:       "#820046"
  cyan:          "#229256"
  white:         "#a8a4a1"
  bright-black:  "#394047"
  bright-red:    "#eb0009"
  bright-green:  "#7ac100"
  bright-yellow: "#ea9a00"
  bright-blue:   "#006efe"
  bright-magenta: "#bf3b7f"
  bright-cyan:   "#00c649"
  bright-white:  "#f4eef0"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
