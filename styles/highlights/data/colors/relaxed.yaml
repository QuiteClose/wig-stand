meta:
  name: Relaxed
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Relaxed.toml"

palette:
  background:    "#353a44"
  foreground:    "#d9d9d9"
  black:         "#151515"
  red:           "#bc5653"
  green:         "#909d63"
  yellow:        "#ebc17a"
  blue:          "#6a8799"
  magenta:       "#b06698"
  cyan:          "#c9dfff"
  white:         "#d9d9d9"
  bright-black:  "#636363"
  bright-red:    "#bc5653"
  bright-green:  "#a0ac77"
  bright-yellow: "#ebc17a"
  bright-blue:   "#7eaac7"
  bright-magenta: "#b06698"
  bright-cyan:   "#acbbd0"
  bright-white:  "#f7f7f7"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
