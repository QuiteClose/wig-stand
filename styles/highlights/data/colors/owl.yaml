meta:
  name: owl
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/owl.toml"

palette:
  background:    "#2f2b2c"
  foreground:    "#dedede"
  black:         "#302c2c"
  red:           "#5a5a5a"
  green:         "#989898"
  yellow:        "#cacaca"
  blue:          "#656565"
  magenta:       "#b1b1b1"
  cyan:          "#7f7f7f"
  white:         "#dedede"
  bright-black:  "#5d595b"
  bright-red:    "#da5b2c"
  bright-green:  "#989898"
  bright-yellow: "#cacaca"
  bright-blue:   "#656565"
  bright-magenta: "#b1b1b1"
  bright-cyan:   "#7f7f7f"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
