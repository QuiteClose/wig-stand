meta:
  name: GitHub Dark Colorblind
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/GitHub%20Dark%20Colorblind.toml"

palette:
  background:    "#0d1117"
  foreground:    "#c9d1d9"
  black:         "#484f58"
  red:           "#ec8e2c"
  green:         "#58a6ff"
  yellow:        "#d29922"
  blue:          "#58a6ff"
  magenta:       "#bc8cff"
  cyan:          "#39c5cf"
  white:         "#b1bac4"
  bright-black:  "#6e7681"
  bright-red:    "#fdac54"
  bright-green:  "#79c0ff"
  bright-yellow: "#e3b341"
  bright-blue:   "#79c0ff"
  bright-magenta: "#d2a8ff"
  bright-cyan:   "#56d4dd"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
