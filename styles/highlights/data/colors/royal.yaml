meta:
  name: Royal
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Royal.toml"

palette:
  background:    "#100815"
  foreground:    "#514968"
  black:         "#241f2b"
  red:           "#91284c"
  green:         "#23801c"
  yellow:        "#b49d27"
  blue:          "#6580b0"
  magenta:       "#674d96"
  cyan:          "#8aaabe"
  white:         "#524966"
  bright-black:  "#3e3a4a"
  bright-red:    "#d5356c"
  bright-green:  "#2cd946"
  bright-yellow: "#fde83b"
  bright-blue:   "#90baf9"
  bright-magenta: "#a479e3"
  bright-cyan:   "#acd4eb"
  bright-white:  "#9e8cbd"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
