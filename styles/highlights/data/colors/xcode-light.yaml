meta:
  name: Xcode Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Xcode%20Light.toml"

palette:
  background:    "#ffffff"
  foreground:    "#262626"
  black:         "#b4d8fd"
  red:           "#d12f1b"
  green:         "#3e8087"
  yellow:        "#78492a"
  blue:          "#0f68a0"
  magenta:       "#ad3da4"
  cyan:          "#804fb8"
  white:         "#262626"
  bright-black:  "#8a99a6"
  bright-red:    "#d12f1b"
  bright-green:  "#23575c"
  bright-yellow: "#78492a"
  bright-blue:   "#0b4f79"
  bright-magenta: "#ad3da4"
  bright-cyan:   "#4b21b0"
  bright-white:  "#262626"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
