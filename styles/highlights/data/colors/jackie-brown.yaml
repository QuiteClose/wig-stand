meta:
  name: Jackie Brown
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Jackie%20Brown.toml"

palette:
  background:    "#2c1d16"
  foreground:    "#ffcc2f"
  black:         "#2c1d16"
  red:           "#ef5734"
  green:         "#2baf2b"
  yellow:        "#bebf00"
  blue:          "#246eb2"
  magenta:       "#d05ec1"
  cyan:          "#00acee"
  white:         "#bfbfbf"
  bright-black:  "#666666"
  bright-red:    "#e50000"
  bright-green:  "#86a93e"
  bright-yellow: "#e5e500"
  bright-blue:   "#0000ff"
  bright-magenta: "#e500e5"
  bright-cyan:   "#00e5e5"
  bright-white:  "#e5e5e5"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
