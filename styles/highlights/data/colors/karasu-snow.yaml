meta:
  name: Karasu Snow
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Karasu%20Snow.toml"

palette:
  background:    "#fafafa"
  foreground:    "#292524"
  black:         "#0a0a0a"
  red:           "#b84755"
  green:         "#3f7e4a"
  yellow:        "#8a6a1f"
  blue:          "#2e5e9b"
  magenta:       "#6c4bb8"
  cyan:          "#2d7e7a"
  white:         "#b5b5b5"
  bright-black:  "#404040"
  bright-red:    "#d93c3c"
  bright-green:  "#2f9150"
  bright-yellow: "#9a7a1d"
  bright-blue:   "#2b72c7"
  bright-magenta: "#7b59d6"
  bright-cyan:   "#1f968f"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
