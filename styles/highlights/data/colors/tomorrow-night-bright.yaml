meta:
  name: Tomorrow Night Bright
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Tomorrow%20Night%20Bright.toml"

palette:
  background:    "#000000"
  foreground:    "#eaeaea"
  black:         "#000000"
  red:           "#d54e53"
  green:         "#b9ca4a"
  yellow:        "#e7c547"
  blue:          "#7aa6da"
  magenta:       "#c397d8"
  cyan:          "#70c0b1"
  white:         "#ffffff"
  bright-black:  "#404040"
  bright-red:    "#d54e53"
  bright-green:  "#b9ca4a"
  bright-yellow: "#e7c547"
  bright-blue:   "#7aa6da"
  bright-magenta: "#c397d8"
  bright-cyan:   "#70c0b1"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
