meta:
  name: Miasma
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Miasma.toml"

palette:
  background:    "#222222"
  foreground:    "#c2c2b0"
  black:         "#000000"
  red:           "#685742"
  green:         "#5f875f"
  yellow:        "#b36d43"
  blue:          "#78824b"
  magenta:       "#bb7744"
  cyan:          "#c9a554"
  white:         "#d7c483"
  bright-black:  "#666666"
  bright-red:    "#685742"
  bright-green:  "#5f875f"
  bright-yellow: "#b36d43"
  bright-blue:   "#78824b"
  bright-magenta: "#bb7744"
  bright-cyan:   "#c9a554"
  bright-white:  "#d7c483"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
