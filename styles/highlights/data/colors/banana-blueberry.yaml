meta:
  name: Banana Blueberry
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Banana%20Blueberry.toml"

palette:
  background:    "#191323"
  foreground:    "#cccccc"
  black:         "#17141f"
  red:           "#ff6b7f"
  green:         "#00bd9c"
  yellow:        "#e6c62f"
  blue:          "#22e8df"
  magenta:       "#dc396a"
  cyan:          "#56b6c2"
  white:         "#f1f1f1"
  bright-black:  "#495162"
  bright-red:    "#fe9ea1"
  bright-green:  "#98c379"
  bright-yellow: "#f9e46b"
  bright-blue:   "#91fff4"
  bright-magenta: "#da70d6"
  bright-cyan:   "#bcf3ff"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
