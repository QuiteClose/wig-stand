meta:
  name: Wombat
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Wombat.toml"

palette:
  background:    "#171717"
  foreground:    "#dedacf"
  black:         "#000000"
  red:           "#ff615a"
  green:         "#b1e969"
  yellow:        "#ebd99c"
  blue:          "#5da9f6"
  magenta:       "#e86aff"
  cyan:          "#82fff7"
  white:         "#dedacf"
  bright-black:  "#4a4a4a"
  bright-red:    "#f58c80"
  bright-green:  "#ddf88f"
  bright-yellow: "#eee5b2"
  bright-blue:   "#a5c7ff"
  bright-magenta: "#ddaaff"
  bright-cyan:   "#b7fff9"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
