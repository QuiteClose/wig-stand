meta:
  name: Synthwave Everything
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Synthwave%20Everything.toml"

palette:
  background:    "#2a2139"
  foreground:    "#f0eff1"
  black:         "#fefefe"
  red:           "#f97e72"
  green:         "#72f1b8"
  yellow:        "#fede5d"
  blue:          "#6d77b3"
  magenta:       "#c792ea"
  cyan:          "#f772e0"
  white:         "#fefefe"
  bright-black:  "#fefefe"
  bright-red:    "#f88414"
  bright-green:  "#72f1b8"
  bright-yellow: "#fff951"
  bright-blue:   "#36f9f6"
  bright-magenta: "#e1acff"
  bright-cyan:   "#f92aad"
  bright-white:  "#fefefe"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
