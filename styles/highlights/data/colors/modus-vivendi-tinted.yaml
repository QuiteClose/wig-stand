meta:
  name: Modus Vivendi Tinted
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Modus%20Vivendi%20Tinted.toml"

palette:
  background:    "#0d0e1c"
  foreground:    "#ffffff"
  black:         "#0d0e1c"
  red:           "#ff5f59"
  green:         "#44bc44"
  yellow:        "#d0bc00"
  blue:          "#2fafff"
  magenta:       "#feacd0"
  cyan:          "#00d3d0"
  white:         "#a6a6a6"
  bright-black:  "#595959"
  bright-red:    "#ff6b55"
  bright-green:  "#00c06f"
  bright-yellow: "#fec43f"
  bright-blue:   "#79a8ff"
  bright-magenta: "#b6a0ff"
  bright-cyan:   "#6ae4b9"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
