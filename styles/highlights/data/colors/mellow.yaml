meta:
  name: Mellow
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Mellow.toml"

palette:
  background:    "#161617"
  foreground:    "#c9c7cd"
  black:         "#27272a"
  red:           "#f5a191"
  green:         "#90b99f"
  yellow:        "#e6b99d"
  blue:          "#aca1cf"
  magenta:       "#e29eca"
  cyan:          "#ea83a5"
  white:         "#c1c0d4"
  bright-black:  "#424246"
  bright-red:    "#ffae9f"
  bright-green:  "#9dc6ac"
  bright-yellow: "#f0c5a9"
  bright-blue:   "#b9aeda"
  bright-magenta: "#ecaad6"
  bright-cyan:   "#f591b2"
  bright-white:  "#cac9dd"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
