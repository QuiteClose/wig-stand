meta:
  name: Sublette
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Sublette.toml"

palette:
  background:    "#202535"
  foreground:    "#ccced0"
  black:         "#253045"
  red:           "#ee5577"
  green:         "#55ee77"
  yellow:        "#ffdd88"
  blue:          "#5588ff"
  magenta:       "#ff77cc"
  cyan:          "#44eeee"
  white:         "#f5f5da"
  bright-black:  "#405570"
  bright-red:    "#ee6655"
  bright-green:  "#99ee77"
  bright-yellow: "#ffff77"
  bright-blue:   "#77bbff"
  bright-magenta: "#aa88ff"
  bright-cyan:   "#55ffbb"
  bright-white:  "#ffffee"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
