meta:
  name: Kolorit
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Kolorit.toml"

palette:
  background:    "#1d1a1e"
  foreground:    "#efecec"
  black:         "#1d1a1e"
  red:           "#ff5b82"
  green:         "#47d7a1"
  yellow:        "#e8e562"
  blue:          "#5db4ee"
  magenta:       "#da6cda"
  cyan:          "#57e9eb"
  white:         "#ededed"
  bright-black:  "#504d51"
  bright-red:    "#ff5b82"
  bright-green:  "#47d7a1"
  bright-yellow: "#e8e562"
  bright-blue:   "#5db4ee"
  bright-magenta: "#da6cda"
  bright-cyan:   "#57e9eb"
  bright-white:  "#ededed"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
