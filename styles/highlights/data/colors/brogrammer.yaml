meta:
  name: Brogrammer
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Brogrammer.toml"

palette:
  background:    "#131313"
  foreground:    "#d6dbe5"
  black:         "#1f1f1f"
  red:           "#f81118"
  green:         "#2dc55e"
  yellow:        "#ecba0f"
  blue:          "#2a84d2"
  magenta:       "#4e5ab7"
  cyan:          "#1081d6"
  white:         "#d6dbe5"
  bright-black:  "#d6dbe5"
  bright-red:    "#de352e"
  bright-green:  "#1dd361"
  bright-yellow: "#f3bd09"
  bright-blue:   "#1081d6"
  bright-magenta: "#5350b9"
  bright-cyan:   "#0f7ddb"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
