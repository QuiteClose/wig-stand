meta:
  name: Vimbones
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Vimbones.toml"

palette:
  background:    "#f0f0ca"
  foreground:    "#353535"
  black:         "#f0f0ca"
  red:           "#a8334c"
  green:         "#4f6c31"
  yellow:        "#944927"
  blue:          "#286486"
  magenta:       "#88507d"
  cyan:          "#3b8992"
  white:         "#353535"
  bright-black:  "#acac89"
  bright-red:    "#94253e"
  bright-green:  "#3f5a22"
  bright-yellow: "#803d1c"
  bright-blue:   "#1d5573"
  bright-magenta: "#7b3b70"
  bright-cyan:   "#2b747c"
  bright-white:  "#5c5c5c"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
