meta:
  name: Vercel
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Vercel.toml"

palette:
  background:    "#101010"
  foreground:    "#fafafa"
  black:         "#000000"
  red:           "#fc0036"
  green:         "#29a948"
  yellow:        "#ffae00"
  blue:          "#006aff"
  magenta:       "#f32882"
  cyan:          "#00ac96"
  white:         "#feffff"
  bright-black:  "#a8a8a8"
  bright-red:    "#ff8080"
  bright-green:  "#4be15d"
  bright-yellow: "#ffae00"
  bright-blue:   "#49aeff"
  bright-magenta: "#f97ea8"
  bright-cyan:   "#00e4c4"
  bright-white:  "#fefefe"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
