meta:
  name: Cutie Pro
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Cutie%20Pro.toml"

palette:
  background:    "#181818"
  foreground:    "#d5d0c9"
  black:         "#000000"
  red:           "#f56e7f"
  green:         "#bec975"
  yellow:        "#f58669"
  blue:          "#42d9c5"
  magenta:       "#d286b7"
  cyan:          "#37cb8a"
  white:         "#d5c3c3"
  bright-black:  "#88847f"
  bright-red:    "#e5a1a3"
  bright-green:  "#e8d6a7"
  bright-yellow: "#f1bb79"
  bright-blue:   "#80c5de"
  bright-magenta: "#b294bb"
  bright-cyan:   "#9dccbb"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
