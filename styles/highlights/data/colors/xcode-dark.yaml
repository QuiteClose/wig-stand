meta:
  name: Xcode Dark
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Xcode%20Dark.toml"

palette:
  background:    "#292a30"
  foreground:    "#dfdfe0"
  black:         "#414453"
  red:           "#ff8170"
  green:         "#78c2b3"
  yellow:        "#d9c97c"
  blue:          "#4eb0cc"
  magenta:       "#ff7ab2"
  cyan:          "#b281eb"
  white:         "#dfdfe0"
  bright-black:  "#7f8c98"
  bright-red:    "#ff8170"
  bright-green:  "#acf2e4"
  bright-yellow: "#ffa14f"
  bright-blue:   "#6bdfff"
  bright-magenta: "#ff7ab2"
  bright-cyan:   "#dabaff"
  bright-white:  "#dfdfe0"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
