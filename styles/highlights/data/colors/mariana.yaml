meta:
  name: Mariana
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Mariana.toml"

palette:
  background:    "#343d46"
  foreground:    "#d8dee9"
  black:         "#000000"
  red:           "#ec5f66"
  green:         "#99c794"
  yellow:        "#f9ae58"
  blue:          "#6699cc"
  magenta:       "#c695c6"
  cyan:          "#5fb4b4"
  white:         "#f7f7f7"
  bright-black:  "#666666"
  bright-red:    "#f97b58"
  bright-green:  "#acd1a8"
  bright-yellow: "#fac761"
  bright-blue:   "#85add6"
  bright-magenta: "#d8b6d8"
  bright-cyan:   "#82c4c4"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
