meta:
  name: Soft Server
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Soft%20Server.toml"

palette:
  background:    "#242626"
  foreground:    "#99a3a2"
  black:         "#000000"
  red:           "#a2686a"
  green:         "#9aa56a"
  yellow:        "#a3906a"
  blue:          "#6b8fa3"
  magenta:       "#6a71a3"
  cyan:          "#6ba58f"
  white:         "#99a3a2"
  bright-black:  "#666c6c"
  bright-red:    "#dd5c60"
  bright-green:  "#bfdf55"
  bright-yellow: "#deb360"
  bright-blue:   "#62b1df"
  bright-magenta: "#606edf"
  bright-cyan:   "#64e39c"
  bright-white:  "#d2e0de"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
