meta:
  name: Tomorrow Night Eighties
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Tomorrow%20Night%20Eighties.toml"

palette:
  background:    "#2d2d2d"
  foreground:    "#cccccc"
  black:         "#000000"
  red:           "#f2777a"
  green:         "#99cc99"
  yellow:        "#ffcc66"
  blue:          "#6699cc"
  magenta:       "#cc99cc"
  cyan:          "#66cccc"
  white:         "#ffffff"
  bright-black:  "#595959"
  bright-red:    "#f2777a"
  bright-green:  "#99cc99"
  bright-yellow: "#ffcc66"
  bright-blue:   "#6699cc"
  bright-magenta: "#cc99cc"
  bright-cyan:   "#66cccc"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
