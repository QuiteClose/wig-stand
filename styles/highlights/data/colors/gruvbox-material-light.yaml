meta:
  name: Gruvbox Material Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Gruvbox%20Material%20Light.toml"

palette:
  background:    "#fbf1c7"
  foreground:    "#654735"
  black:         "#fbf1c7"
  red:           "#c14a4a"
  green:         "#6c782e"
  yellow:        "#b47109"
  blue:          "#45707a"
  magenta:       "#945e80"
  cyan:          "#4c7a5d"
  white:         "#654735"
  bright-black:  "#a89984"
  bright-red:    "#c14a4a"
  bright-green:  "#6c782e"
  bright-yellow: "#b47109"
  bright-blue:   "#45707a"
  bright-magenta: "#945e80"
  bright-cyan:   "#4c7a5d"
  bright-white:  "#4f3829"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
