meta:
  name: Clear Dark
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Clear%20Dark.toml"

palette:
  background:    "#212734"
  foreground:    "#e6e6e6"
  black:         "#35424c"
  red:           "#b45648"
  green:         "#6caa71"
  yellow:        "#c4ac62"
  blue:          "#6d96b4"
  magenta:       "#bd7bcd"
  cyan:          "#7ccbcd"
  white:         "#dee5eb"
  bright-black:  "#465c6d"
  bright-red:    "#df6c5a"
  bright-green:  "#79be7e"
  bright-yellow: "#e5c872"
  bright-blue:   "#67b5ed"
  bright-magenta: "#d389e5"
  bright-cyan:   "#84dde0"
  bright-white:  "#e5eff5"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
