meta:
  name: Forest Blue
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Forest%20Blue.toml"

palette:
  background:    "#051519"
  foreground:    "#e2d8cd"
  black:         "#333333"
  red:           "#f8818e"
  green:         "#92d3a2"
  yellow:        "#1a8e63"
  blue:          "#8ed0ce"
  magenta:       "#5e468c"
  cyan:          "#31658c"
  white:         "#e2d8cd"
  bright-black:  "#4a4a4a"
  bright-red:    "#fb3d66"
  bright-green:  "#6bb48d"
  bright-yellow: "#30c85a"
  bright-blue:   "#39a7a2"
  bright-magenta: "#7e62b3"
  bright-cyan:   "#6096bf"
  bright-white:  "#e2d8cd"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
