meta:
  name: One Half Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/One%20Half%20Light.toml"

palette:
  background:    "#fafafa"
  foreground:    "#383a42"
  black:         "#383a42"
  red:           "#e45649"
  green:         "#50a14f"
  yellow:        "#c18401"
  blue:          "#0184bc"
  magenta:       "#a626a4"
  cyan:          "#0997b3"
  white:         "#bababa"
  bright-black:  "#4f525e"
  bright-red:    "#e06c75"
  bright-green:  "#98c379"
  bright-yellow: "#d8b36e"
  bright-blue:   "#61afef"
  bright-magenta: "#c678dd"
  bright-cyan:   "#56b6c2"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
