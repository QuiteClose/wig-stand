meta:
  name: Dimmed Monokai
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Dimmed%20Monokai.toml"

palette:
  background:    "#1f1f1f"
  foreground:    "#b9bcba"
  black:         "#3a3d43"
  red:           "#be3f48"
  green:         "#879a3b"
  yellow:        "#c5a635"
  blue:          "#4f76a1"
  magenta:       "#855c8d"
  cyan:          "#578fa4"
  white:         "#b9bcba"
  bright-black:  "#888987"
  bright-red:    "#fb001f"
  bright-green:  "#0f722f"
  bright-yellow: "#c47033"
  bright-blue:   "#186de3"
  bright-magenta: "#fb0067"
  bright-cyan:   "#2e706d"
  bright-white:  "#fdffb9"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
