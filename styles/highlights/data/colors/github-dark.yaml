meta:
  name: GitHub Dark
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/GitHub%20Dark.toml"

palette:
  background:    "#101216"
  foreground:    "#8b949e"
  black:         "#000000"
  red:           "#f78166"
  green:         "#56d364"
  yellow:        "#e3b341"
  blue:          "#6ca4f8"
  magenta:       "#db61a2"
  cyan:          "#2b7489"
  white:         "#ffffff"
  bright-black:  "#4d4d4d"
  bright-red:    "#f78166"
  bright-green:  "#56d364"
  bright-yellow: "#e3b341"
  bright-blue:   "#6ca4f8"
  bright-magenta: "#db61a2"
  bright-cyan:   "#2b7489"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
