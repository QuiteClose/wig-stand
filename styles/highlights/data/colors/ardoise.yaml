meta:
  name: Ardoise
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Ardoise.toml"

palette:
  background:    "#1e1e1e"
  foreground:    "#eaeaea"
  black:         "#2c2c2c"
  red:           "#d3322d"
  green:         "#588b35"
  yellow:        "#fca93a"
  blue:          "#2465c2"
  magenta:       "#7332b4"
  cyan:          "#64e1b8"
  white:         "#f7f7f7"
  bright-black:  "#535353"
  bright-red:    "#fa5852"
  bright-green:  "#8dc252"
  bright-yellow: "#ffea51"
  bright-blue:   "#6ab5f8"
  bright-magenta: "#be68ca"
  bright-cyan:   "#89ffdb"
  bright-white:  "#fefefe"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
