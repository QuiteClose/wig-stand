meta:
  name: Monospace Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Monospace%20Light.toml"

palette:
  background:    "#f4f7fd"
  foreground:    "#475365"
  black:         "#333e4f"
  red:           "#d03941"
  green:         "#007b49"
  yellow:        "#a65921"
  blue:          "#3c60dd"
  magenta:       "#6f4cde"
  cyan:          "#0075a2"
  white:         "#5d6a7d"
  bright-black:  "#000000"
  bright-red:    "#a52430"
  bright-green:  "#00522f"
  bright-yellow: "#904b1a"
  bright-blue:   "#002487"
  bright-magenta: "#4d21bb"
  bright-cyan:   "#00607e"
  bright-white:  "#475365"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
