meta:
  name: Night Owlish Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Night%20Owlish%20Light.toml"

palette:
  background:    "#ffffff"
  foreground:    "#403f53"
  black:         "#011627"
  red:           "#d3423e"
  green:         "#2aa298"
  yellow:        "#daaa01"
  blue:          "#4876d6"
  magenta:       "#403f53"
  cyan:          "#08916a"
  white:         "#7a8181"
  bright-black:  "#7a8181"
  bright-red:    "#f76e6e"
  bright-green:  "#49d0c5"
  bright-yellow: "#dac26b"
  bright-blue:   "#5ca7e4"
  bright-magenta: "#697098"
  bright-cyan:   "#00c990"
  bright-white:  "#989fb1"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
