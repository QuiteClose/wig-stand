meta:
  name: Selenized Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Selenized%20Light.toml"

palette:
  background:    "#fbf3db"
  foreground:    "#53676d"
  black:         "#ece3cc"
  red:           "#d2212d"
  green:         "#489100"
  yellow:        "#ad8900"
  blue:          "#0072d4"
  magenta:       "#ca4898"
  cyan:          "#009c8f"
  white:         "#53676d"
  bright-black:  "#909995"
  bright-red:    "#cc1729"
  bright-green:  "#428b00"
  bright-yellow: "#a78300"
  bright-blue:   "#006dce"
  bright-magenta: "#c44392"
  bright-cyan:   "#00978a"
  bright-white:  "#3a4d53"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
