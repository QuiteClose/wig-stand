meta:
  name: SeedFlip Phosphor
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/SeedFlip%20Phosphor.toml"

palette:
  background:    "#0c0c0c"
  foreground:    "#b3ffb3"
  black:         "#070707"
  red:           "#f04242"
  green:         "#42f07c"
  yellow:        "#f0d342"
  blue:          "#428bf0"
  magenta:       "#f042f0"
  cyan:          "#42f0f0"
  white:         "#cdffcd"
  bright-black:  "#3f3f3f"
  bright-red:    "#f58989"
  bright-green:  "#89f5ad"
  bright-yellow: "#f5e389"
  bright-blue:   "#89b6f5"
  bright-magenta: "#f589f5"
  bright-cyan:   "#89f5f5"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
