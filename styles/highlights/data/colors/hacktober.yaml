meta:
  name: Hacktober
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Hacktober.toml"

palette:
  background:    "#141414"
  foreground:    "#c9c9c9"
  black:         "#191918"
  red:           "#b34538"
  green:         "#587744"
  yellow:        "#d08949"
  blue:          "#206ec5"
  magenta:       "#864651"
  cyan:          "#ac9166"
  white:         "#f1eee7"
  bright-black:  "#464444"
  bright-red:    "#b33323"
  bright-green:  "#42824a"
  bright-yellow: "#c75a22"
  bright-blue:   "#5389c5"
  bright-magenta: "#e795a5"
  bright-cyan:   "#ebc587"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
