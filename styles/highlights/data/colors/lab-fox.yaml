meta:
  name: Lab Fox
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Lab%20Fox.toml"

palette:
  background:    "#2e2e2e"
  foreground:    "#ffffff"
  black:         "#2e2e2e"
  red:           "#fc6d26"
  green:         "#3eb383"
  yellow:        "#fca121"
  blue:          "#db3b21"
  magenta:       "#6b40a8"
  cyan:          "#6e49cb"
  white:         "#ffffff"
  bright-black:  "#535353"
  bright-red:    "#ff6517"
  bright-green:  "#53eaa8"
  bright-yellow: "#fca013"
  bright-blue:   "#db501f"
  bright-magenta: "#6a36b6"
  bright-cyan:   "#7d53e7"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
