meta:
  name: Ayu Mirage
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Ayu%20Mirage.toml"

palette:
  background:    "#1f2430"
  foreground:    "#cccac2"
  black:         "#171b24"
  red:           "#ed8274"
  green:         "#87d96c"
  yellow:        "#facc6e"
  blue:          "#6dcbfa"
  magenta:       "#dabafa"
  cyan:          "#90e1c6"
  white:         "#c7c7c7"
  bright-black:  "#686868"
  bright-red:    "#f28779"
  bright-green:  "#d5ff80"
  bright-yellow: "#ffd173"
  bright-blue:   "#73d0ff"
  bright-magenta: "#dfbfff"
  bright-cyan:   "#95e6cb"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
