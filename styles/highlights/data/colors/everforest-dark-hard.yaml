meta:
  name: Everforest Dark Hard
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Everforest%20Dark%20Hard.toml"

palette:
  background:    "#1e2326"
  foreground:    "#d3c6aa"
  black:         "#7a8478"
  red:           "#e67e80"
  green:         "#a7c080"
  yellow:        "#dbbc7f"
  blue:          "#7fbbb3"
  magenta:       "#d699b6"
  cyan:          "#83c092"
  white:         "#f2efdf"
  bright-black:  "#a6b0a0"
  bright-red:    "#f85552"
  bright-green:  "#8da101"
  bright-yellow: "#dfa000"
  bright-blue:   "#3a94c5"
  bright-magenta: "#df69ba"
  bright-cyan:   "#35a77c"
  bright-white:  "#fffbef"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
