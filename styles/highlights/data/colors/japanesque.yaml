meta:
  name: Japanesque
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Japanesque.toml"

palette:
  background:    "#1e1e1e"
  foreground:    "#f7f6ec"
  black:         "#343935"
  red:           "#cf3f61"
  green:         "#7bb75b"
  yellow:        "#e9b32a"
  blue:          "#4c9ad4"
  magenta:       "#a57fc4"
  cyan:          "#389aad"
  white:         "#fafaf6"
  bright-black:  "#595b59"
  bright-red:    "#d18fa6"
  bright-green:  "#767f2c"
  bright-yellow: "#78592f"
  bright-blue:   "#135979"
  bright-magenta: "#604291"
  bright-cyan:   "#76bbca"
  bright-white:  "#b2b5ae"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
