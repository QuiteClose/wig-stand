meta:
  name: Desert
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Desert.toml"

palette:
  background:    "#333333"
  foreground:    "#ffffff"
  black:         "#4d4d4d"
  red:           "#ff2b2b"
  green:         "#98fb98"
  yellow:        "#f0e68c"
  blue:          "#cd853f"
  magenta:       "#ffdead"
  cyan:          "#ffa0a0"
  white:         "#f5deb3"
  bright-black:  "#626262"
  bright-red:    "#ff5555"
  bright-green:  "#55ff55"
  bright-yellow: "#ffff55"
  bright-blue:   "#87ceff"
  bright-magenta: "#ff55ff"
  bright-cyan:   "#ffd700"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
