meta:
  name: Flat
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Flat.toml"

palette:
  background:    "#002240"
  foreground:    "#2cc55d"
  black:         "#222d3f"
  red:           "#a82320"
  green:         "#32a548"
  yellow:        "#e58d11"
  blue:          "#3167ac"
  magenta:       "#781aa0"
  cyan:          "#2c9370"
  white:         "#b0b6ba"
  bright-black:  "#475262"
  bright-red:    "#d4312e"
  bright-green:  "#2d9440"
  bright-yellow: "#e5be0c"
  bright-blue:   "#3c7dd2"
  bright-magenta: "#8230a7"
  bright-cyan:   "#35b387"
  bright-white:  "#e7eced"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
