meta:
  name: Nvim Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Nvim%20Light.toml"

palette:
  background:    "#e0e2ea"
  foreground:    "#14161b"
  black:         "#07080d"
  red:           "#590008"
  green:         "#005523"
  yellow:        "#6b5300"
  blue:          "#004c73"
  magenta:       "#470045"
  cyan:          "#007373"
  white:         "#a1a4ab"
  bright-black:  "#4f5258"
  bright-red:    "#590008"
  bright-green:  "#005523"
  bright-yellow: "#6b5300"
  bright-blue:   "#004c73"
  bright-magenta: "#470045"
  bright-cyan:   "#007373"
  bright-white:  "#eef1f8"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
