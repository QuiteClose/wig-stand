meta:
  name: Apple System Colors Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Apple%20System%20Colors%20Light.toml"

palette:
  background:    "#feffff"
  foreground:    "#000000"
  black:         "#1a1a1a"
  red:           "#cc372e"
  green:         "#26a439"
  yellow:        "#cdac08"
  blue:          "#0869cb"
  magenta:       "#9647bf"
  cyan:          "#479ec2"
  white:         "#98989d"
  bright-black:  "#464646"
  bright-red:    "#ff453a"
  bright-green:  "#32d74b"
  bright-yellow: "#e5bc00"
  bright-blue:   "#0a84ff"
  bright-magenta: "#bf5af2"
  bright-cyan:   "#69c9f2"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
