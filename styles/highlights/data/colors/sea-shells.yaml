meta:
  name: Sea Shells
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Sea%20Shells.toml"

palette:
  background:    "#09141b"
  foreground:    "#deb88d"
  black:         "#17384c"
  red:           "#d15123"
  green:         "#027c9b"
  yellow:        "#fca02f"
  blue:          "#1e4950"
  magenta:       "#68d4f1"
  cyan:          "#50a3b5"
  white:         "#deb88d"
  bright-black:  "#434b53"
  bright-red:    "#d48678"
  bright-green:  "#628d98"
  bright-yellow: "#fdd39f"
  bright-blue:   "#1bbcdd"
  bright-magenta: "#bbe3ee"
  bright-cyan:   "#87acb4"
  bright-white:  "#fee4ce"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
