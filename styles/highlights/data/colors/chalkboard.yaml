meta:
  name: Chalkboard
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Chalkboard.toml"

palette:
  background:    "#29262f"
  foreground:    "#d9e6f2"
  black:         "#000000"
  red:           "#c37372"
  green:         "#72c373"
  yellow:        "#c2c372"
  blue:          "#7372c3"
  magenta:       "#c372c2"
  cyan:          "#72c2c3"
  white:         "#d9d9d9"
  bright-black:  "#585858"
  bright-red:    "#dbaaaa"
  bright-green:  "#aadbaa"
  bright-yellow: "#dadbaa"
  bright-blue:   "#aaaadb"
  bright-magenta: "#dbaada"
  bright-cyan:   "#aadadb"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
