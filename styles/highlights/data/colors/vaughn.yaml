meta:
  name: Vaughn
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Vaughn.toml"

palette:
  background:    "#25234f"
  foreground:    "#dcdccc"
  black:         "#25234f"
  red:           "#705050"
  green:         "#60b48a"
  yellow:        "#dfaf8f"
  blue:          "#5555ff"
  magenta:       "#f08cc3"
  cyan:          "#8cd0d3"
  white:         "#709080"
  bright-black:  "#709080"
  bright-red:    "#dca3a3"
  bright-green:  "#60b48a"
  bright-yellow: "#f0dfaf"
  bright-blue:   "#5555ff"
  bright-magenta: "#ec93d3"
  bright-cyan:   "#93e0e3"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
