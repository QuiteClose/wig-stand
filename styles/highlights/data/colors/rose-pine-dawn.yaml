meta:
  name: Rose Pine Dawn
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Rose%20Pine%20Dawn.toml"

palette:
  background:    "#faf4ed"
  foreground:    "#575279"
  black:         "#f2e9e1"
  red:           "#b4637a"
  green:         "#286983"
  yellow:        "#ea9d34"
  blue:          "#56949f"
  magenta:       "#907aa9"
  cyan:          "#d7827e"
  white:         "#575279"
  bright-black:  "#9893a5"
  bright-red:    "#b4637a"
  bright-green:  "#286983"
  bright-yellow: "#ea9d34"
  bright-blue:   "#56949f"
  bright-magenta: "#907aa9"
  bright-cyan:   "#d7827e"
  bright-white:  "#575279"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
