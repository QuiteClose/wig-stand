meta:
  name: Thayer Bright
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Thayer%20Bright.toml"

palette:
  background:    "#1b1d1e"
  foreground:    "#f8f8f8"
  black:         "#1b1d1e"
  red:           "#f92672"
  green:         "#4df840"
  yellow:        "#f4fd22"
  blue:          "#2757d6"
  magenta:       "#8c54fe"
  cyan:          "#38c8b5"
  white:         "#ccccc6"
  bright-black:  "#505354"
  bright-red:    "#ff5995"
  bright-green:  "#b6e354"
  bright-yellow: "#feed6c"
  bright-blue:   "#3f78ff"
  bright-magenta: "#9e6ffe"
  bright-cyan:   "#23cfd5"
  bright-white:  "#f8f8f2"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
