meta:
  name: Dayfox
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Dayfox.toml"

palette:
  background:    "#f6f2ee"
  foreground:    "#3d2b5a"
  black:         "#352c24"
  red:           "#a5222f"
  green:         "#396847"
  yellow:        "#ac5402"
  blue:          "#2848a9"
  magenta:       "#6e33ce"
  cyan:          "#287980"
  white:         "#bfb6ae"
  bright-black:  "#534c45"
  bright-red:    "#b3434e"
  bright-green:  "#577f63"
  bright-yellow: "#b86e28"
  bright-blue:   "#4863b6"
  bright-magenta: "#8452d5"
  bright-cyan:   "#488d93"
  bright-white:  "#f4ece6"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
