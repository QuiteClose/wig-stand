meta:
  name: Dracula
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Dracula.toml"

palette:
  background:    "#282a36"
  foreground:    "#f8f8f2"
  black:         "#21222c"
  red:           "#ff5555"
  green:         "#50fa7b"
  yellow:        "#f1fa8c"
  blue:          "#bd93f9"
  magenta:       "#ff79c6"
  cyan:          "#8be9fd"
  white:         "#f8f8f2"
  bright-black:  "#6272a4"
  bright-red:    "#ff6e6e"
  bright-green:  "#69ff94"
  bright-yellow: "#ffffa5"
  bright-blue:   "#d6acff"
  bright-magenta: "#ff92df"
  bright-cyan:   "#a4ffff"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
