meta:
  name: Catppuccin Frappe
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Catppuccin%20Frappe.toml"

palette:
  background:    "#303446"
  foreground:    "#c6d0f5"
  black:         "#51576d"
  red:           "#e78284"
  green:         "#a6d189"
  yellow:        "#e5c890"
  blue:          "#8caaee"
  magenta:       "#f4b8e4"
  cyan:          "#81c8be"
  white:         "#a5adce"
  bright-black:  "#626880"
  bright-red:    "#e67172"
  bright-green:  "#8ec772"
  bright-yellow: "#d9ba73"
  bright-blue:   "#7b9ef0"
  bright-magenta: "#f2a4db"
  bright-cyan:   "#5abfb5"
  bright-white:  "#b5bfe2"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
