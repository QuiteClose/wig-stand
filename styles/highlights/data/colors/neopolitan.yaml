meta:
  name: Neopolitan
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Neopolitan.toml"

palette:
  background:    "#271f19"
  foreground:    "#ffffff"
  black:         "#000000"
  red:           "#9a1a1a"
  green:         "#61ce3c"
  yellow:        "#fbde2d"
  blue:          "#324883"
  magenta:       "#ff0080"
  cyan:          "#8da6ce"
  white:         "#f8f8f8"
  bright-black:  "#4c4c4c"
  bright-red:    "#9a1a1a"
  bright-green:  "#61ce3c"
  bright-yellow: "#fbde2d"
  bright-blue:   "#324883"
  bright-magenta: "#ff0080"
  bright-cyan:   "#8da6ce"
  bright-white:  "#f8f8f8"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
