meta:
  name: Snazzy
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Snazzy.toml"

palette:
  background:    "#1e1f29"
  foreground:    "#ebece6"
  black:         "#000000"
  red:           "#fc4346"
  green:         "#50fb7c"
  yellow:        "#f0fb8c"
  blue:          "#49baff"
  magenta:       "#fc4cb4"
  cyan:          "#8be9fe"
  white:         "#ededec"
  bright-black:  "#555555"
  bright-red:    "#fc4346"
  bright-green:  "#50fb7c"
  bright-yellow: "#f0fb8c"
  bright-blue:   "#49baff"
  bright-magenta: "#fc4cb4"
  bright-cyan:   "#8be9fe"
  bright-white:  "#ededec"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
