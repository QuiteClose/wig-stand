meta:
  name: Hopscotch.256
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Hopscotch.256.toml"

palette:
  background:    "#322931"
  foreground:    "#b9b5b8"
  black:         "#322931"
  red:           "#dd464c"
  green:         "#8fc13e"
  yellow:        "#fdcc59"
  blue:          "#1290bf"
  magenta:       "#c85e7c"
  cyan:          "#149b93"
  white:         "#b9b5b8"
  bright-black:  "#797379"
  bright-red:    "#dd464c"
  bright-green:  "#8fc13e"
  bright-yellow: "#fdcc59"
  bright-blue:   "#1290bf"
  bright-magenta: "#c85e7c"
  bright-cyan:   "#149b93"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
