meta:
  name: Heeler
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Heeler.toml"

palette:
  background:    "#211f46"
  foreground:    "#fdfdfd"
  black:         "#000000"
  red:           "#e44c2e"
  green:         "#bdd100"
  yellow:        "#f4ce65"
  blue:          "#5ba5f2"
  magenta:       "#ff95c2"
  cyan:          "#ff9763"
  white:         "#ffffff"
  bright-black:  "#4c4c4c"
  bright-red:    "#e44c2e"
  bright-green:  "#bdd100"
  bright-yellow: "#f4ce65"
  bright-blue:   "#0088ff"
  bright-magenta: "#ff95c2"
  bright-cyan:   "#8da6e4"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
