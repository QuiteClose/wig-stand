meta:
  name: Elemental
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Elemental.toml"

palette:
  background:    "#22211d"
  foreground:    "#807a74"
  black:         "#3c3c30"
  red:           "#98290f"
  green:         "#479a43"
  yellow:        "#7f7111"
  blue:          "#497f7d"
  magenta:       "#7f4e2f"
  cyan:          "#387f58"
  white:         "#807974"
  bright-black:  "#555445"
  bright-red:    "#e0502a"
  bright-green:  "#61e070"
  bright-yellow: "#d69927"
  bright-blue:   "#79d9d9"
  bright-magenta: "#cd7c54"
  bright-cyan:   "#59d599"
  bright-white:  "#fff1e9"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
