meta:
  name: Starlight
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Starlight.toml"

palette:
  background:    "#242424"
  foreground:    "#ffffff"
  black:         "#242424"
  red:           "#f62b5a"
  green:         "#47b413"
  yellow:        "#e3c401"
  blue:          "#24acd4"
  magenta:       "#f2affd"
  cyan:          "#13c299"
  white:         "#e6e6e6"
  bright-black:  "#616161"
  bright-red:    "#ff4d51"
  bright-green:  "#35d450"
  bright-yellow: "#e9e836"
  bright-blue:   "#5dc5f8"
  bright-magenta: "#feabf2"
  bright-cyan:   "#24dfc4"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
