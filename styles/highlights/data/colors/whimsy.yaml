meta:
  name: Whimsy
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Whimsy.toml"

palette:
  background:    "#29283b"
  foreground:    "#b3b0d6"
  black:         "#535178"
  red:           "#ef6487"
  green:         "#5eca89"
  yellow:        "#fdd877"
  blue:          "#65aef7"
  magenta:       "#aa7ff0"
  cyan:          "#43c1be"
  white:         "#ffffff"
  bright-black:  "#535178"
  bright-red:    "#ef6487"
  bright-green:  "#5eca89"
  bright-yellow: "#fdd877"
  bright-blue:   "#65aef7"
  bright-magenta: "#aa7ff0"
  bright-cyan:   "#43c1be"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
