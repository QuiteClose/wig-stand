meta:
  name: One Double Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/One%20Double%20Light.toml"

palette:
  background:    "#fafafa"
  foreground:    "#383a43"
  black:         "#454b58"
  red:           "#f74840"
  green:         "#25a343"
  yellow:        "#cc8100"
  blue:          "#0087c1"
  magenta:       "#b50da9"
  cyan:          "#009ab7"
  white:         "#c5b2b3"
  bright-black:  "#0e131f"
  bright-red:    "#ff3711"
  bright-green:  "#00b90e"
  bright-yellow: "#ec9900"
  bright-blue:   "#1065de"
  bright-magenta: "#e500d8"
  bright-cyan:   "#00b4dd"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
