meta:
  name: Gruber Darker
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Gruber%20Darker.toml"

palette:
  background:    "#181818"
  foreground:    "#e4e4e4"
  black:         "#181818"
  red:           "#ff0a36"
  green:         "#42dc00"
  yellow:        "#ffdb00"
  blue:          "#92a7cb"
  magenta:       "#a095cb"
  cyan:          "#90aa9e"
  white:         "#e4e4e4"
  bright-black:  "#54494e"
  bright-red:    "#ff3851"
  bright-green:  "#42dc00"
  bright-yellow: "#ffdb00"
  bright-blue:   "#92a7cb"
  bright-magenta: "#afafda"
  bright-cyan:   "#90aa9e"
  bright-white:  "#f5f5f5"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
