meta:
  name: Neon
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Neon.toml"

palette:
  background:    "#14161a"
  foreground:    "#00fffc"
  black:         "#000000"
  red:           "#ff3045"
  green:         "#5ffa74"
  yellow:        "#fffc7e"
  blue:          "#0f15d8"
  magenta:       "#f924e7"
  cyan:          "#00fffc"
  white:         "#c7c7c7"
  bright-black:  "#686868"
  bright-red:    "#ff5a5a"
  bright-green:  "#75ff88"
  bright-yellow: "#fffd96"
  bright-blue:   "#3c40cb"
  bright-magenta: "#f15be5"
  bright-cyan:   "#88fffe"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
