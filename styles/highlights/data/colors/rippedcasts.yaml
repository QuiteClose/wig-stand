meta:
  name: Rippedcasts
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Rippedcasts.toml"

palette:
  background:    "#2b2b2b"
  foreground:    "#ffffff"
  black:         "#000000"
  red:           "#cdaf95"
  green:         "#a8ff60"
  yellow:        "#bfbb1f"
  blue:          "#75a5b0"
  magenta:       "#ff73fd"
  cyan:          "#5a647e"
  white:         "#bfbfbf"
  bright-black:  "#666666"
  bright-red:    "#eecbad"
  bright-green:  "#bcee68"
  bright-yellow: "#e5e500"
  bright-blue:   "#86bdc9"
  bright-magenta: "#e500e5"
  bright-cyan:   "#8c9bc4"
  bright-white:  "#e5e5e5"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
