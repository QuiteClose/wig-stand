meta:
  name: Neutron
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Neutron.toml"

palette:
  background:    "#1c1e22"
  foreground:    "#e6e8ef"
  black:         "#23252b"
  red:           "#b54036"
  green:         "#5ab977"
  yellow:        "#deb566"
  blue:          "#6a7c93"
  magenta:       "#a4799d"
  cyan:          "#3f94a8"
  white:         "#e6e8ef"
  bright-black:  "#494b51"
  bright-red:    "#b54036"
  bright-green:  "#5ab977"
  bright-yellow: "#deb566"
  bright-blue:   "#6a7c93"
  bright-magenta: "#a4799d"
  bright-cyan:   "#3f94a8"
  bright-white:  "#ebedf2"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
