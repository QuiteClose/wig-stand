meta:
  name: Birds Of Paradise
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Birds%20Of%20Paradise.toml"

palette:
  background:    "#2a1f1d"
  foreground:    "#e0dbb7"
  black:         "#573d26"
  red:           "#be2d26"
  green:         "#6ba18a"
  yellow:        "#e99d2a"
  blue:          "#5a86ad"
  magenta:       "#ac80a6"
  cyan:          "#74a6ad"
  white:         "#e0dbb7"
  bright-black:  "#9b6c4a"
  bright-red:    "#e84627"
  bright-green:  "#95d8ba"
  bright-yellow: "#d0d150"
  bright-blue:   "#b8d3ed"
  bright-magenta: "#d19ecb"
  bright-cyan:   "#93cfd7"
  bright-white:  "#fff9d5"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
