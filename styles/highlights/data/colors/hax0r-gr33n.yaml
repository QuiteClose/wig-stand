  foreground:    "#16b10e"
  black:         "#001f0b"
  red:           "#15d00d"
  green:         "#15d00d"
  yellow:        "#15d00d"
  blue:          "#15d00d"
  magenta:       "#15d00d"
  cyan:          "#15d00d"
  white:         "#fafafa"
  bright-black:  "#334843"
  bright-red:    "#19e20e"
  bright-green:  "#19e20e"
  bright-yellow: "#19e20e"
  bright-blue:   "#19e20e"
  bright-magenta: "#19e20e"
  bright-cyan:   "#19e20e"
  bright-white:  "#fefefe"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
