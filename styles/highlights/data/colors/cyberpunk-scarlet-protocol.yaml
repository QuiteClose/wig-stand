meta:
  name: Cyberpunk Scarlet Protocol
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Cyberpunk%20Scarlet%20Protocol.toml"

palette:
  background:    "#101116"
  foreground:    "#e41951"
  black:         "#101116"
  red:           "#ff0051"
  green:         "#01dc84"
  yellow:        "#faf945"
  blue:          "#0271b6"
  magenta:       "#c930c7"
  cyan:          "#00c5c7"
  white:         "#c7c7c7"
  bright-black:  "#686868"
  bright-red:    "#ff6e67"
  bright-green:  "#60fa68"
  bright-yellow: "#fffc67"
  bright-blue:   "#6871ff"
  bright-magenta: "#bd35ec"
  bright-cyan:   "#60fdff"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
