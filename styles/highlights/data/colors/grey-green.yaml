meta:
  name: Grey Green
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Grey%20Green.toml"

palette:
  background:    "#002a1a"
  foreground:    "#ffffff"
  black:         "#000000"
  red:           "#fe1414"
  green:         "#74ff00"
  yellow:        "#f1ff01"
  blue:          "#00deff"
  magenta:       "#ff00f0"
  cyan:          "#00ffbc"
  white:         "#ffffff"
  bright-black:  "#666666"
  bright-red:    "#ff3939"
  bright-green:  "#00ff44"
  bright-yellow: "#ffd100"
  bright-blue:   "#00afff"
  bright-magenta: "#ff008a"
  bright-cyan:   "#00ffd3"
  bright-white:  "#f5ecec"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
