meta:
  name: Warm Neon
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Warm%20Neon.toml"

palette:
  background:    "#404040"
  foreground:    "#afdab6"
  black:         "#000000"
  red:           "#e24346"
  green:         "#39b13a"
  yellow:        "#dae145"
  blue:          "#4261c5"
  magenta:       "#f920fb"
  cyan:          "#2abbd4"
  white:         "#d0b8a3"
  bright-black:  "#fefcfc"
  bright-red:    "#e97071"
  bright-green:  "#9cc090"
  bright-yellow: "#ddda7a"
  bright-blue:   "#7b91d6"
  bright-magenta: "#f674ba"
  bright-cyan:   "#5ed1e5"
  bright-white:  "#d8c8bb"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
