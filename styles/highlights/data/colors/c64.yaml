meta:
  name: C64
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/C64.toml"

palette:
  background:    "#40318d"
  foreground:    "#7869c4"
  black:         "#090300"
  red:           "#a2524c"
  green:         "#55a049"
  yellow:        "#bfce72"
  blue:          "#6657b3"
  magenta:       "#984ca3"
  cyan:          "#67b6bd"
  white:         "#ffffff"
  bright-black:  "#000000"
  bright-red:    "#a2524c"
  bright-green:  "#55a049"
  bright-yellow: "#bfce72"
  bright-blue:   "#6657b3"
  bright-magenta: "#984ca3"
  bright-cyan:   "#67b6bd"
  bright-white:  "#f7f7f7"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
