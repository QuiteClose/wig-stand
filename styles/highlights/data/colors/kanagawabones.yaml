meta:
  name: Kanagawabones
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Kanagawabones.toml"

palette:
  background:    "#1f1f28"
  foreground:    "#ddd8bb"
  black:         "#1f1f28"
  red:           "#e46a78"
  green:         "#98bc6d"
  yellow:        "#e5c283"
  blue:          "#7eb3c9"
  magenta:       "#957fb8"
  cyan:          "#7eb3c9"
  white:         "#ddd8bb"
  bright-black:  "#49495e"
  bright-red:    "#ec818c"
  bright-green:  "#9ec967"
  bright-yellow: "#f1c982"
  bright-blue:   "#7bc2df"
  bright-magenta: "#a98fd2"
  bright-cyan:   "#7bc2df"
  bright-white:  "#a8a48d"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
