meta:
  name: Piatto Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Piatto%20Light.toml"

palette:
  background:    "#ffffff"
  foreground:    "#414141"
  black:         "#414141"
  red:           "#b23771"
  green:         "#66781e"
  yellow:        "#cd6f34"
  blue:          "#3c5ea8"
  magenta:       "#a454b2"
  cyan:          "#66781e"
  white:         "#bfbfbf"
  bright-black:  "#3f3f3f"
  bright-red:    "#db3365"
  bright-green:  "#829429"
  bright-yellow: "#cd6f34"
  bright-blue:   "#3c5ea8"
  bright-magenta: "#a454b2"
  bright-cyan:   "#829429"
  bright-white:  "#f2f2f2"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
