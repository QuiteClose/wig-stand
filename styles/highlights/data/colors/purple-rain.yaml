meta:
  name: Purple Rain
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Purple%20Rain.toml"

palette:
  background:    "#21084a"
  foreground:    "#fffbf6"
  black:         "#000000"
  red:           "#ff260e"
  green:         "#9be205"
  yellow:        "#ffc400"
  blue:          "#00a2fa"
  magenta:       "#815bb5"
  cyan:          "#00deef"
  white:         "#ffffff"
  bright-black:  "#565656"
  bright-red:    "#ff4250"
  bright-green:  "#b8e36e"
  bright-yellow: "#ffd852"
  bright-blue:   "#00a6ff"
  bright-magenta: "#ac7bf0"
  bright-cyan:   "#74fdf3"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
