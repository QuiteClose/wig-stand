meta:
  name: Monokai Vivid
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Monokai%20Vivid.toml"

palette:
  background:    "#121212"
  foreground:    "#f9f9f9"
  black:         "#121212"
  red:           "#fa2934"
  green:         "#98e123"
  yellow:        "#fff30a"
  blue:          "#0443ff"
  magenta:       "#f800f8"
  cyan:          "#01b6ed"
  white:         "#ffffff"
  bright-black:  "#838383"
  bright-red:    "#f6669d"
  bright-green:  "#b1e05f"
  bright-yellow: "#fff26d"
  bright-blue:   "#0443ff"
  bright-magenta: "#f200f6"
  bright-cyan:   "#51ceff"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
