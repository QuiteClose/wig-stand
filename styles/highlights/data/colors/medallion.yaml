meta:
  name: Medallion
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Medallion.toml"

palette:
  background:    "#1d1908"
  foreground:    "#cac296"
  black:         "#000000"
  red:           "#b64c00"
  green:         "#7c8b16"
  yellow:        "#d3bd26"
  blue:          "#616bb0"
  magenta:       "#8c5a90"
  cyan:          "#916c25"
  white:         "#cac29a"
  bright-black:  "#5e5219"
  bright-red:    "#ff9149"
  bright-green:  "#b2ca3b"
  bright-yellow: "#ffe54a"
  bright-blue:   "#acb8ff"
  bright-magenta: "#ffa0ff"
  bright-cyan:   "#ffbc51"
  bright-white:  "#fed698"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
