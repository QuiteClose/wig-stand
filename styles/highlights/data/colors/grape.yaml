meta:
  name: Grape
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Grape.toml"

palette:
  background:    "#171423"
  foreground:    "#9f9fa1"
  black:         "#2d283f"
  red:           "#ed2261"
  green:         "#1fa91b"
  yellow:        "#8ddc20"
  blue:          "#487df4"
  magenta:       "#8d35c9"
  cyan:          "#3bdeed"
  white:         "#9e9ea0"
  bright-black:  "#59516a"
  bright-red:    "#f0729a"
  bright-green:  "#53aa5e"
  bright-yellow: "#b2dc87"
  bright-blue:   "#a9bcec"
  bright-magenta: "#ad81c2"
  bright-cyan:   "#9de3eb"
  bright-white:  "#a288f7"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
