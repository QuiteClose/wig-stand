meta:
  name: Clear Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Clear%20Light.toml"

palette:
  background:    "#ffffff"
  foreground:    "#3a4851"
  black:         "#2d3840"
  red:           "#b45648"
  green:         "#6caa71"
  yellow:        "#c4ac62"
  blue:          "#5685a8"
  magenta:       "#ad64be"
  cyan:          "#69c6c9"
  white:         "#b4bbbf"
  bright-black:  "#506573"
  bright-red:    "#df6c5a"
  bright-green:  "#79be7e"
  bright-yellow: "#d8bb65"
  bright-blue:   "#49a2e1"
  bright-magenta: "#d389e5"
  bright-cyan:   "#5ec7cb"
  bright-white:  "#d8e1e7"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
