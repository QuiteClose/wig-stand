meta:
  name: Idea
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Idea.toml"

palette:
  background:    "#202020"
  foreground:    "#adadad"
  black:         "#adadad"
  red:           "#fc5256"
  green:         "#98b61c"
  yellow:        "#ccb444"
  blue:          "#437ee7"
  magenta:       "#9d74b0"
  cyan:          "#248887"
  white:         "#4b4b4b"
  bright-black:  "#ffffff"
  bright-red:    "#fc7072"
  bright-green:  "#98b61c"
  bright-yellow: "#ffff0b"
  bright-blue:   "#6c9ced"
  bright-magenta: "#fc7eff"
  bright-cyan:   "#248887"
  bright-white:  "#181818"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
