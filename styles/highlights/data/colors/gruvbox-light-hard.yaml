meta:
  name: Gruvbox Light Hard
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Gruvbox%20Light%20Hard.toml"

palette:
  background:    "#f9f5d7"
  foreground:    "#3c3836"
  black:         "#f9f5d7"
  red:           "#cc241d"
  green:         "#98971a"
  yellow:        "#d79921"
  blue:          "#458588"
  magenta:       "#b16286"
  cyan:          "#689d6a"
  white:         "#7c6f64"
  bright-black:  "#928374"
  bright-red:    "#9d0006"
  bright-green:  "#79740e"
  bright-yellow: "#b57614"
  bright-blue:   "#076678"
  bright-magenta: "#8f3f71"
  bright-cyan:   "#427b58"
  bright-white:  "#3c3836"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
