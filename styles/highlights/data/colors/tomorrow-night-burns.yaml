meta:
  name: Tomorrow Night Burns
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Tomorrow%20Night%20Burns.toml"

palette:
  background:    "#151515"
  foreground:    "#a1b0b8"
  black:         "#252525"
  red:           "#832e31"
  green:         "#a63c40"
  yellow:        "#d3494e"
  blue:          "#fc595f"
  magenta:       "#df9395"
  cyan:          "#ba8586"
  white:         "#f5f5f5"
  bright-black:  "#5d6f71"
  bright-red:    "#832e31"
  bright-green:  "#a63c40"
  bright-yellow: "#d2494e"
  bright-blue:   "#fc595f"
  bright-magenta: "#df9395"
  bright-cyan:   "#ba8586"
  bright-white:  "#f5f5f5"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
