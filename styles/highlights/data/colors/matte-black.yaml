meta:
  name: Matte Black
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Matte%20Black.toml"

palette:
  background:    "#121212"
  foreground:    "#bebebe"
  black:         "#333333"
  red:           "#d35f5f"
  green:         "#ffc107"
  yellow:        "#b91c1c"
  blue:          "#e68e0d"
  magenta:       "#d35f5f"
  cyan:          "#bebebe"
  white:         "#bebebe"
  bright-black:  "#8a8a8d"
  bright-red:    "#891c1c"
  bright-green:  "#ffc107"
  bright-yellow: "#b90a0a"
  bright-blue:   "#f59e0b"
  bright-magenta: "#b91c1c"
  bright-cyan:   "#eaeaea"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
