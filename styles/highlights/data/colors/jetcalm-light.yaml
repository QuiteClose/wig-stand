meta:
  name: JetCalm Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/JetCalm%20Light.toml"

palette:
  background:    "#ededed"
  foreground:    "#1c2410"
  black:         "#383a42"
  red:           "#a52a2a"
  green:         "#556b2f"
  yellow:        "#5c3e00"
  blue:          "#4682b4"
  magenta:       "#a626a4"
  cyan:          "#0997b3"
  white:         "#6b8e23"
  bright-black:  "#4f525d"
  bright-red:    "#df6c75"
  bright-green:  "#2e8b57"
  bright-yellow: "#808000"
  bright-blue:   "#008080"
  bright-magenta: "#c577dd"
  bright-cyan:   "#008080"
  bright-white:  "#7b8d9e"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
