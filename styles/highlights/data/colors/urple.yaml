meta:
  name: Urple
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Urple.toml"

palette:
  background:    "#1b1b23"
  foreground:    "#877a9b"
  black:         "#000000"
  red:           "#b0425b"
  green:         "#37a415"
  yellow:        "#ad5c42"
  blue:          "#564d9b"
  magenta:       "#6c3ca1"
  cyan:          "#808080"
  white:         "#87799c"
  bright-black:  "#6a3f32"
  bright-red:    "#ff6388"
  bright-green:  "#29e620"
  bright-yellow: "#f08161"
  bright-blue:   "#867aed"
  bright-magenta: "#a05eee"
  bright-cyan:   "#eaeaea"
  bright-white:  "#bfa3ff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
