meta:
  name: Cursor Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Cursor%20Light.toml"

palette:
  background:    "#f3f3f3"
  foreground:    "#252525"
  black:         "#252525"
  red:           "#cf2d56"
  green:         "#1f8a65"
  yellow:        "#a16900"
  blue:          "#3c7cab"
  magenta:       "#b8448b"
  cyan:          "#4c7f8c"
  white:         "#afafaf"
  bright-black:  "#5c5c5c"
  bright-red:    "#e75e78"
  bright-green:  "#55a583"
  bright-yellow: "#c08532"
  bright-blue:   "#6299c3"
  bright-magenta: "#d06ba6"
  bright-cyan:   "#6f9ba6"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
