meta:
  name: Tomorrow Night
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Tomorrow%20Night.toml"

palette:
  background:    "#1d1f21"
  foreground:    "#c5c8c6"
  black:         "#000000"
  red:           "#cc6666"
  green:         "#b5bd68"
  yellow:        "#f0c674"
  blue:          "#81a2be"
  magenta:       "#b294bb"
  cyan:          "#8abeb7"
  white:         "#ffffff"
  bright-black:  "#4c4c4c"
  bright-red:    "#cc6666"
  bright-green:  "#b5bd68"
  bright-yellow: "#f0c674"
  bright-blue:   "#81a2be"
  bright-magenta: "#b294bb"
  bright-cyan:   "#8abeb7"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
