meta:
  name: Kibble
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Kibble.toml"

palette:
  background:    "#0e100a"
  foreground:    "#f7f7f7"
  black:         "#4d4d4d"
  red:           "#c70031"
  green:         "#29cf13"
  yellow:        "#d8e30e"
  blue:          "#3449d1"
  magenta:       "#8400ff"
  cyan:          "#0798ab"
  white:         "#e2d1e3"
  bright-black:  "#5a5a5a"
  bright-red:    "#f01578"
  bright-green:  "#6ce05c"
  bright-yellow: "#f3f79e"
  bright-blue:   "#97a4f7"
  bright-magenta: "#c495f0"
  bright-cyan:   "#68f2e0"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
