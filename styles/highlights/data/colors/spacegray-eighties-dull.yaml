meta:
  name: Spacegray Eighties Dull
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Spacegray%20Eighties%20Dull.toml"

palette:
  background:    "#222222"
  foreground:    "#c9c6bc"
  black:         "#15171c"
  red:           "#b24a56"
  green:         "#92b477"
  yellow:        "#c6735a"
  blue:          "#7c8fa5"
  magenta:       "#a5789e"
  cyan:          "#80cdcb"
  white:         "#b3b8c3"
  bright-black:  "#555555"
  bright-red:    "#ec5f67"
  bright-green:  "#89e986"
  bright-yellow: "#fec254"
  bright-blue:   "#5486c0"
  bright-magenta: "#bf83c1"
  bright-cyan:   "#58c2c1"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
