meta:
  name: Seafoam Pastel
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Seafoam%20Pastel.toml"

palette:
  background:    "#243435"
  foreground:    "#d4e7d4"
  black:         "#757575"
  red:           "#825d4d"
  green:         "#728c62"
  yellow:        "#ada16d"
  blue:          "#4d7b82"
  magenta:       "#8a7267"
  cyan:          "#729494"
  white:         "#e0e0e0"
  bright-black:  "#8a8a8a"
  bright-red:    "#cf937a"
  bright-green:  "#98d9aa"
  bright-yellow: "#fae79d"
  bright-blue:   "#7ac3cf"
  bright-magenta: "#d6b2a1"
  bright-cyan:   "#ade0e0"
  bright-white:  "#e0e0e0"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
