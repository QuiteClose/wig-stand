meta:
  name: Front End Delight
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Front%20End%20Delight.toml"

palette:
  background:    "#1b1c1d"
  foreground:    "#adadad"
  black:         "#242526"
  red:           "#f8511b"
  green:         "#565747"
  yellow:        "#fa771d"
  blue:          "#2c70b7"
  magenta:       "#f02e4f"
  cyan:          "#3ca1a6"
  white:         "#adadad"
  bright-black:  "#5fac6d"
  bright-red:    "#f74319"
  bright-green:  "#74ec4c"
  bright-yellow: "#fdc325"
  bright-blue:   "#3393ca"
  bright-magenta: "#e75e4f"
  bright-cyan:   "#4fbce6"
  bright-white:  "#8c735b"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
