meta:
  name: Kanso Pearl
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Kanso%20Pearl.toml"

palette:
  background:    "#f2f1ef"
  foreground:    "#22262d"
  black:         "#22262d"
  red:           "#c84053"
  green:         "#6f894e"
  yellow:        "#77713f"
  blue:          "#4d699b"
  magenta:       "#b35b79"
  cyan:          "#597b75"
  white:         "#545464"
  bright-black:  "#6d6f6e"
  bright-red:    "#d7474b"
  bright-green:  "#6e915f"
  bright-yellow: "#836f4a"
  bright-blue:   "#6693bf"
  bright-magenta: "#624c83"
  bright-cyan:   "#5e857a"
  bright-white:  "#43436c"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
