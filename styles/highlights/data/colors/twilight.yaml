meta:
  name: Twilight
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Twilight.toml"

palette:
  background:    "#141414"
  foreground:    "#ffffd4"
  black:         "#141414"
  red:           "#c06d44"
  green:         "#afb97a"
  yellow:        "#c2a86c"
  blue:          "#44474a"
  magenta:       "#b4be7c"
  cyan:          "#778385"
  white:         "#ffffd4"
  bright-black:  "#404040"
  bright-red:    "#de7c4c"
  bright-green:  "#ccd88c"
  bright-yellow: "#e2c47e"
  bright-blue:   "#5a5e62"
  bright-magenta: "#d0dc8e"
  bright-cyan:   "#8a989b"
  bright-white:  "#ffffd4"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
