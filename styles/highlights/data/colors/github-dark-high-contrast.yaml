meta:
  name: GitHub Dark High Contrast
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/GitHub%20Dark%20High%20Contrast.toml"

palette:
  background:    "#0a0c10"
  foreground:    "#f0f3f6"
  black:         "#7a828e"
  red:           "#ff9492"
  green:         "#26cd4d"
  yellow:        "#f0b72f"
  blue:          "#71b7ff"
  magenta:       "#cb9eff"
  cyan:          "#39c5cf"
  white:         "#d9dee3"
  bright-black:  "#9ea7b3"
  bright-red:    "#ffb1af"
  bright-green:  "#4ae168"
  bright-yellow: "#f7c843"
  bright-blue:   "#91cbff"
  bright-magenta: "#dbb7ff"
  bright-cyan:   "#56d4dd"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
