meta:
  name: SeedFlip Wavelength
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/SeedFlip%20Wavelength.toml"

palette:
  background:    "#0d1117"
  foreground:    "#e6edf3"
  black:         "#090c10"
  red:           "#d55d5d"
  green:         "#5dd585"
  yellow:        "#d5c15d"
  blue:          "#5d8fd5"
  magenta:       "#d55dd5"
  cyan:          "#5dd5d5"
  white:         "#f7f9fb"
  bright-black:  "#364255"
  bright-red:    "#e59a9a"
  bright-green:  "#9ae5b3"
  bright-yellow: "#e5d89a"
  bright-blue:   "#9ab9e5"
  bright-magenta: "#e59ae5"
  bright-cyan:   "#9ae5e5"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
