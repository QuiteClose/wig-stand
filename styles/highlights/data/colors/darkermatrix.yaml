meta:
  name: Darkermatrix
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Darkermatrix.toml"

palette:
  background:    "#070c0e"
  foreground:    "#35451a"
  black:         "#091013"
  red:           "#1a4831"
  green:         "#6fa64c"
  yellow:        "#595900"
  blue:          "#00cb6b"
  magenta:       "#4e375a"
  cyan:          "#125459"
  white:         "#1a4833"
  bright-black:  "#404040"
  bright-red:    "#0d452a"
  bright-green:  "#90d762"
  bright-yellow: "#e2e500"
  bright-blue:   "#00ff87"
  bright-magenta: "#4e375a"
  bright-cyan:   "#176c73"
  bright-white:  "#00381e"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
