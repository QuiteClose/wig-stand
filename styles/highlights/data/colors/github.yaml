meta:
  name: GitHub
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/GitHub.toml"

palette:
  background:    "#f4f4f4"
  foreground:    "#3e3e3e"
  black:         "#3e3e3e"
  red:           "#970b16"
  green:         "#07962a"
  yellow:        "#c5bb94"
  blue:          "#003e8a"
  magenta:       "#e94691"
  cyan:          "#7cc4df"
  white:         "#b2b2b2"
  bright-black:  "#666666"
  bright-red:    "#de0000"
  bright-green:  "#7ac895"
  bright-yellow: "#d7b600"
  bright-blue:   "#2e6cba"
  bright-magenta: "#f29592"
  bright-cyan:   "#00c7cb"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
