meta:
  name: Aurora
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Aurora.toml"

palette:
  background:    "#23262e"
  foreground:    "#ffca28"
  black:         "#23262e"
  red:           "#f0266f"
  green:         "#8fd46d"
  yellow:        "#ffe66d"
  blue:          "#102ee4"
  magenta:       "#ee5d43"
  cyan:          "#03d6b8"
  white:         "#c74ded"
  bright-black:  "#4f545e"
  bright-red:    "#f92672"
  bright-green:  "#8fd46d"
  bright-yellow: "#ffe66d"
  bright-blue:   "#03d6b8"
  bright-magenta: "#ee5d43"
  bright-cyan:   "#03d6b8"
  bright-white:  "#c74ded"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
