meta:
  name: Poimandres White
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Poimandres%20White.toml"

palette:
  background:    "#fefeff"
  foreground:    "#969cbd"
  black:         "#fefeff"
  red:           "#ff2090"
  green:         "#01dab2"
  yellow:        "#e5ba4e"
  blue:          "#8abacd"
  magenta:       "#eb8394"
  cyan:          "#8abacd"
  white:         "#000000"
  bright-black:  "#969cbd"
  bright-red:    "#ff2090"
  bright-green:  "#01dab2"
  bright-yellow: "#e5ba4e"
  bright-blue:   "#0ebfff"
  bright-magenta: "#eb8394"
  bright-cyan:   "#0ebfff"
  bright-white:  "#000000"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
