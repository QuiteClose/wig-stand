meta:
  name: SeedFlip Canopy
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/SeedFlip%20Canopy.toml"

palette:
  background:    "#0f1714"
  foreground:    "#ededed"
  black:         "#0b110f"
  red:           "#d65c5c"
  green:         "#5cd685"
  yellow:        "#d6c25c"
  blue:          "#5c8fd6"
  magenta:       "#d65cd6"
  cyan:          "#5cd6d6"
  white:         "#fafafa"
  bright-black:  "#2d453c"
  bright-red:    "#e69999"
  bright-green:  "#99e6b2"
  bright-yellow: "#e6d999"
  bright-blue:   "#99b9e6"
  bright-magenta: "#e699e6"
  bright-cyan:   "#99e6e6"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
