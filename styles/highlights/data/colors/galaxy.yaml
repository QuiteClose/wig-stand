meta:
  name: Galaxy
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Galaxy.toml"

palette:
  background:    "#1d2837"
  foreground:    "#ffffff"
  black:         "#000000"
  red:           "#f9555f"
  green:         "#21b089"
  yellow:        "#fef02a"
  blue:          "#589df6"
  magenta:       "#944d95"
  cyan:          "#1f9ee7"
  white:         "#bbbbbb"
  bright-black:  "#555555"
  bright-red:    "#fa8c8f"
  bright-green:  "#35bb9a"
  bright-yellow: "#ffff55"
  bright-blue:   "#589df6"
  bright-magenta: "#e75699"
  bright-cyan:   "#3979bc"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
