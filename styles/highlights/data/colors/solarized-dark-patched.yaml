meta:
  name: Solarized Dark Patched
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Solarized%20Dark%20Patched.toml"

palette:
  background:    "#001e27"
  foreground:    "#708284"
  black:         "#002831"
  red:           "#d11c24"
  green:         "#738a05"
  yellow:        "#a57706"
  blue:          "#2176c7"
  magenta:       "#c61c6f"
  cyan:          "#259286"
  white:         "#eae3cb"
  bright-black:  "#475b62"
  bright-red:    "#bd3613"
  bright-green:  "#475b62"
  bright-yellow: "#536870"
  bright-blue:   "#708284"
  bright-magenta: "#5956ba"
  bright-cyan:   "#819090"
  bright-white:  "#fcf4dc"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
