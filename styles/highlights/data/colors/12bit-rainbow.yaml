meta:
  name: 12-bit Rainbow
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/12-bit%20Rainbow.toml"

palette:
  background:    "#040404"
  foreground:    "#feffff"
  black:         "#000000"
  red:           "#a03050"
  green:         "#40d080"
  yellow:        "#e09040"
  blue:          "#3060b0"
  magenta:       "#603090"
  cyan:          "#0090c0"
  white:         "#dbded8"
  bright-black:  "#685656"
  bright-red:    "#c06060"
  bright-green:  "#90d050"
  bright-yellow: "#e0d000"
  bright-blue:   "#00b0c0"
  bright-magenta: "#801070"
  bright-cyan:   "#20b0c0"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
