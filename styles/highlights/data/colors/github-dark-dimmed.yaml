meta:
  name: GitHub Dark Dimmed
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/GitHub%20Dark%20Dimmed.toml"

palette:
  background:    "#22272e"
  foreground:    "#adbac7"
  black:         "#545d68"
  red:           "#f47067"
  green:         "#57ab5a"
  yellow:        "#c69026"
  blue:          "#539bf5"
  magenta:       "#b083f0"
  cyan:          "#39c5cf"
  white:         "#909dab"
  bright-black:  "#636e7b"
  bright-red:    "#ff938a"
  bright-green:  "#6bc46d"
  bright-yellow: "#daaa3f"
  bright-blue:   "#6cb6ff"
  bright-magenta: "#dcbdfb"
  bright-cyan:   "#56d4dd"
  bright-white:  "#cdd9e5"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
