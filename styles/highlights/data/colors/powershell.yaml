meta:
  name: Powershell
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Powershell.toml"

palette:
  background:    "#052454"
  foreground:    "#f6f6f7"
  black:         "#000000"
  red:           "#981a22"
  green:         "#098003"
  yellow:        "#c4a000"
  blue:          "#4140c3"
  magenta:       "#d33682"
  cyan:          "#0e807f"
  white:         "#7f7c7f"
  bright-black:  "#808080"
  bright-red:    "#ef2929"
  bright-green:  "#1cfe3c"
  bright-yellow: "#fefe45"
  bright-blue:   "#268ad2"
  bright-magenta: "#fe13fa"
  bright-cyan:   "#29fffe"
  bright-white:  "#c2c1c3"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
