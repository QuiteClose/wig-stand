meta:
  name: Doom Peacock
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Doom%20Peacock.toml"

palette:
  background:    "#2b2a27"
  foreground:    "#ede0ce"
  black:         "#1c1f24"
  red:           "#cb4b16"
  green:         "#26a6a6"
  yellow:        "#bcd42a"
  blue:          "#2a6cc6"
  magenta:       "#a9a1e1"
  cyan:          "#5699af"
  white:         "#ede0ce"
  bright-black:  "#51504d"
  bright-red:    "#ff5d38"
  bright-green:  "#98be65"
  bright-yellow: "#e6f972"
  bright-blue:   "#51afef"
  bright-magenta: "#c678dd"
  bright-cyan:   "#46d9ff"
  bright-white:  "#dfdfdf"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
