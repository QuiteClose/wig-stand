meta:
  name: Material Darker
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Material%20Darker.toml"

palette:
  background:    "#212121"
  foreground:    "#eeffff"
  black:         "#000000"
  red:           "#ff5370"
  green:         "#c3e88d"
  yellow:        "#ffcb6b"
  blue:          "#82aaff"
  magenta:       "#c792ea"
  cyan:          "#89ddff"
  white:         "#ffffff"
  bright-black:  "#545454"
  bright-red:    "#ff5370"
  bright-green:  "#c3e88d"
  bright-yellow: "#ffcb6b"
  bright-blue:   "#82aaff"
  bright-magenta: "#c792ea"
  bright-cyan:   "#89ddff"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
