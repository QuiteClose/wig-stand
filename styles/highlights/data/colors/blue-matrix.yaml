meta:
  name: Blue Matrix
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Blue%20Matrix.toml"

palette:
  background:    "#101116"
  foreground:    "#00a2ff"
  black:         "#101116"
  red:           "#ff5680"
  green:         "#00ff9c"
  yellow:        "#fffc58"
  blue:          "#00b0ff"
  magenta:       "#d57bff"
  cyan:          "#76c1ff"
  white:         "#c7c7c7"
  bright-black:  "#686868"
  bright-red:    "#ff6e67"
  bright-green:  "#5ffa68"
  bright-yellow: "#fffc67"
  bright-blue:   "#6871ff"
  bright-magenta: "#d682ec"
  bright-cyan:   "#60fdff"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
