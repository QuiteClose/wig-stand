meta:
  name: Rebecca
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Rebecca.toml"

palette:
  background:    "#292a44"
  foreground:    "#e8e6ed"
  black:         "#12131e"
  red:           "#dd7755"
  green:         "#04dbb5"
  yellow:        "#f2e7b7"
  blue:          "#7aa5ff"
  magenta:       "#bf9cf9"
  cyan:          "#56d3c2"
  white:         "#e4e3e9"
  bright-black:  "#666699"
  bright-red:    "#ff92cd"
  bright-green:  "#01eac0"
  bright-yellow: "#fffca8"
  bright-blue:   "#69c0fa"
  bright-magenta: "#c17ff8"
  bright-cyan:   "#8bfde1"
  bright-white:  "#f4f2f9"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
