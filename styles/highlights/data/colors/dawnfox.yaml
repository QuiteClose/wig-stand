meta:
  name: Dawnfox
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Dawnfox.toml"

palette:
  background:    "#faf4ed"
  foreground:    "#575279"
  black:         "#575279"
  red:           "#b4637a"
  green:         "#618774"
  yellow:        "#ea9d34"
  blue:          "#286983"
  magenta:       "#907aa9"
  cyan:          "#56949f"
  white:         "#b2b6bd"
  bright-black:  "#5f5695"
  bright-red:    "#c26d85"
  bright-green:  "#629f81"
  bright-yellow: "#eea846"
  bright-blue:   "#2d81a3"
  bright-magenta: "#9a80b9"
  bright-cyan:   "#5ca7b4"
  bright-white:  "#e6ebf3"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
