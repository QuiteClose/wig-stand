meta:
  name: Broadcast
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Broadcast.toml"

palette:
  background:    "#2b2b2b"
  foreground:    "#e6e1dc"
  black:         "#000000"
  red:           "#da4939"
  green:         "#519f50"
  yellow:        "#ffd24a"
  blue:          "#6d9cbe"
  magenta:       "#d0d0ff"
  cyan:          "#6e9cbe"
  white:         "#ffffff"
  bright-black:  "#585858"
  bright-red:    "#ff7b6b"
  bright-green:  "#83d182"
  bright-yellow: "#ffff7c"
  bright-blue:   "#9fcef0"
  bright-magenta: "#ffffff"
  bright-cyan:   "#a0cef0"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
