meta:
  name: iTerm2 Default
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/iTerm2%20Default.toml"

palette:
  background:    "#000000"
  foreground:    "#ffffff"
  black:         "#000000"
  red:           "#c91b00"
  green:         "#00c200"
  yellow:        "#c7c400"
  blue:          "#2225c4"
  magenta:       "#ca30c7"
  cyan:          "#00c5c7"
  white:         "#ffffff"
  bright-black:  "#686868"
  bright-red:    "#ff6e67"
  bright-green:  "#5ffa68"
  bright-yellow: "#fffc67"
  bright-blue:   "#6871ff"
  bright-magenta: "#ff77ff"
  bright-cyan:   "#60fdff"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
