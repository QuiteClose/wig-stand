meta:
  name: Solarized Dark Higher Contrast
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Solarized%20Dark%20Higher%20Contrast.toml"

palette:
  background:    "#001e27"
  foreground:    "#9cc2c3"
  black:         "#002831"
  red:           "#d11c24"
  green:         "#6cbe6c"
  yellow:        "#a57706"
  blue:          "#2176c7"
  magenta:       "#c61c6f"
  cyan:          "#259286"
  white:         "#eae3cb"
  bright-black:  "#006488"
  bright-red:    "#f5163b"
  bright-green:  "#51ef84"
  bright-yellow: "#b27e28"
  bright-blue:   "#178ec8"
  bright-magenta: "#e24d8e"
  bright-cyan:   "#00b39e"
  bright-white:  "#fcf4dc"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
