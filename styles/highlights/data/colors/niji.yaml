meta:
  name: Niji
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Niji.toml"

palette:
  background:    "#141515"
  foreground:    "#ffffff"
  black:         "#333333"
  red:           "#d23e08"
  green:         "#54ca74"
  yellow:        "#fff700"
  blue:          "#2ab9ff"
  magenta:       "#ff50da"
  cyan:          "#1ef9f5"
  white:         "#ddd0c4"
  bright-black:  "#515151"
  bright-red:    "#ffb7b7"
  bright-green:  "#c1ffae"
  bright-yellow: "#fcffb8"
  bright-blue:   "#8efff3"
  bright-magenta: "#ffa2ed"
  bright-cyan:   "#bcffc7"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
