meta:
  name: Solarized Darcula
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Solarized%20Darcula.toml"

palette:
  background:    "#3d3f41"
  foreground:    "#d2d8d9"
  black:         "#25292a"
  red:           "#f24840"
  green:         "#629655"
  yellow:        "#b68800"
  blue:          "#2075c7"
  magenta:       "#797fd4"
  cyan:          "#15968d"
  white:         "#d2d8d9"
  bright-black:  "#65696a"
  bright-red:    "#f24840"
  bright-green:  "#629655"
  bright-yellow: "#b68800"
  bright-blue:   "#2075c7"
  bright-magenta: "#797fd4"
  bright-cyan:   "#15968d"
  bright-white:  "#d2d8d9"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
