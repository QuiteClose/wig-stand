meta:
  name: Synthwave Alpha
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Synthwave%20Alpha.toml"

palette:
  background:    "#241b30"
  foreground:    "#f2f2e3"
  black:         "#241b30"
  red:           "#e60a70"
  green:         "#00986c"
  yellow:        "#adad3e"
  blue:          "#6e29ad"
  magenta:       "#b300ad"
  cyan:          "#00b0b1"
  white:         "#b9b1bc"
  bright-black:  "#7f7094"
  bright-red:    "#e60a70"
  bright-green:  "#0ae4a4"
  bright-yellow: "#f9f972"
  bright-blue:   "#aa54f9"
  bright-magenta: "#ff00f6"
  bright-cyan:   "#00fbfd"
  bright-white:  "#f2f2e3"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
