meta:
  name: Monokai Pro
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Monokai%20Pro.toml"

palette:
  background:    "#2d2a2e"
  foreground:    "#fcfcfa"
  black:         "#2d2a2e"
  red:           "#ff6188"
  green:         "#a9dc76"
  yellow:        "#ffd866"
  blue:          "#fc9867"
  magenta:       "#ab9df2"
  cyan:          "#78dce8"
  white:         "#fcfcfa"
  bright-black:  "#727072"
  bright-red:    "#ff6188"
  bright-green:  "#a9dc76"
  bright-yellow: "#ffd866"
  bright-blue:   "#fc9867"
  bright-magenta: "#ab9df2"
  bright-cyan:   "#78dce8"
  bright-white:  "#fcfcfa"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
