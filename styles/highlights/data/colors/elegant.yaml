meta:
  name: Elegant
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Elegant.toml"

palette:
  background:    "#292b31"
  foreground:    "#ced2d6"
  black:         "#0a1222"
  red:           "#ff0257"
  green:         "#85cc95"
  yellow:        "#ffcb8b"
  blue:          "#8dabe1"
  magenta:       "#c792eb"
  cyan:          "#78ccf0"
  white:         "#ffffff"
  bright-black:  "#575656"
  bright-red:    "#ff0057"
  bright-green:  "#85cc95"
  bright-yellow: "#ffcb8b"
  bright-blue:   "#8dabe1"
  bright-magenta: "#c792eb"
  bright-cyan:   "#3facef"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
