meta:
  name: Popping And Locking
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Popping%20And%20Locking.toml"

palette:
  background:    "#181921"
  foreground:    "#ebdbb2"
  black:         "#1d2021"
  red:           "#cc241d"
  green:         "#98971a"
  yellow:        "#d79921"
  blue:          "#458588"
  magenta:       "#b16286"
  cyan:          "#689d6a"
  white:         "#a89984"
  bright-black:  "#928374"
  bright-red:    "#f42c3e"
  bright-green:  "#b8bb26"
  bright-yellow: "#fabd2f"
  bright-blue:   "#99c6ca"
  bright-magenta: "#d3869b"
  bright-cyan:   "#7ec16e"
  bright-white:  "#ebdbb2"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
