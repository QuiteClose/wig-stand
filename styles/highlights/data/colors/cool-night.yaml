meta:
  name: Cool Night
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Cool%20Night.toml"

palette:
  background:    "#010c18"
  foreground:    "#ecdef4"
  black:         "#0b3b61"
  red:           "#ff3a3a"
  green:         "#52ffd0"
  yellow:        "#fff383"
  blue:          "#1376f9"
  magenta:       "#c792ea"
  cyan:          "#ff5ed4"
  white:         "#16fda2"
  bright-black:  "#63686d"
  bright-red:    "#ff54b0"
  bright-green:  "#74ffd8"
  bright-yellow: "#fcf5ae"
  bright-blue:   "#388eff"
  bright-magenta: "#ae81ff"
  bright-cyan:   "#ff6ad7"
  bright-white:  "#60fbbf"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
