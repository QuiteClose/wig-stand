meta:
  name: Mellifluous
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Mellifluous.toml"

palette:
  background:    "#1a1a1a"
  foreground:    "#dadada"
  black:         "#1a1a1a"
  red:           "#d29393"
  green:         "#b3b393"
  yellow:        "#cbaa89"
  blue:          "#a8a1be"
  magenta:       "#b39fb0"
  cyan:          "#c0af8c"
  white:         "#dadada"
  bright-black:  "#5b5b5b"
  bright-red:    "#c95954"
  bright-green:  "#828040"
  bright-yellow: "#a6794c"
  bright-blue:   "#5a6599"
  bright-magenta: "#9c6995"
  bright-cyan:   "#74a39e"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
