meta:
  name: Ultra Dark
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Ultra%20Dark.toml"

palette:
  background:    "#000000"
  foreground:    "#ffffff"
  black:         "#000000"
  red:           "#f07178"
  green:         "#c3e88d"
  yellow:        "#ffcb6b"
  blue:          "#82aaff"
  magenta:       "#c792ea"
  cyan:          "#89ddff"
  white:         "#cccccc"
  bright-black:  "#404040"
  bright-red:    "#f6a9ae"
  bright-green:  "#dbf1ba"
  bright-yellow: "#ffdfa6"
  bright-blue:   "#b4ccff"
  bright-magenta: "#ddbdf2"
  bright-cyan:   "#b8eaff"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
