meta:
  name: Abernathy
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Abernathy.toml"

palette:
  background:    "#111416"
  foreground:    "#eeeeec"
  black:         "#000000"
  red:           "#cd0000"
  green:         "#00cd00"
  yellow:        "#cdcd00"
  blue:          "#1093f5"
  magenta:       "#cd00cd"
  cyan:          "#00cdcd"
  white:         "#faebd7"
  bright-black:  "#404040"
  bright-red:    "#ff0000"
  bright-green:  "#00ff00"
  bright-yellow: "#ffff00"
  bright-blue:   "#11b5f6"
  bright-magenta: "#ff00ff"
  bright-cyan:   "#00ffff"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
