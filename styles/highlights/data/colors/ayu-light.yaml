meta:
  name: Ayu Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Ayu%20Light.toml"

palette:
  background:    "#f8f9fa"
  foreground:    "#5c6166"
  black:         "#000000"
  red:           "#ea6c6d"
  green:         "#6cbf43"
  yellow:        "#eca944"
  blue:          "#3199e1"
  magenta:       "#9e75c7"
  cyan:          "#46ba94"
  white:         "#bababa"
  bright-black:  "#686868"
  bright-red:    "#f07171"
  bright-green:  "#86b300"
  bright-yellow: "#f2ae49"
  bright-blue:   "#399ee6"
  bright-magenta: "#a37acc"
  bright-cyan:   "#4cbf99"
  bright-white:  "#d1d1d1"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
