meta:
  name: Andromeda
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Andromeda.toml"

palette:
  background:    "#262a33"
  foreground:    "#e5e5e5"
  black:         "#000000"
  red:           "#cd3131"
  green:         "#05bc79"
  yellow:        "#e5e512"
  blue:          "#2472c8"
  magenta:       "#bc3fbc"
  cyan:          "#0fa8cd"
  white:         "#e5e5e5"
  bright-black:  "#666666"
  bright-red:    "#cd3131"
  bright-green:  "#05bc79"
  bright-yellow: "#e5e512"
  bright-blue:   "#2472c8"
  bright-magenta: "#bc3fbc"
  bright-cyan:   "#0fa8cd"
  bright-white:  "#e5e5e5"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
