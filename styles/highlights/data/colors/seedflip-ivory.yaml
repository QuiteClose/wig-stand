meta:
  name: SeedFlip Ivory
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/SeedFlip%20Ivory.toml"

palette:
  background:    "#ffffff"
  foreground:    "#0a2540"
  black:         "#d9d9d9"
  red:           "#bd0f0f"
  green:         "#0fbd49"
  yellow:        "#bda00f"
  blue:          "#0f58bd"
  magenta:       "#bd0fbd"
  cyan:          "#0fbdbd"
  white:         "#07182a"
  bright-black:  "#b3b3b3"
  bright-red:    "#ee2b2b"
  bright-green:  "#12d452"
  bright-yellow: "#e1c01e"
  bright-blue:   "#2b7cee"
  bright-magenta: "#ee2bee"
  bright-cyan:   "#12d4d4"
  bright-white:  "#0a2540"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
