meta:
  name: Cobalt Neon
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Cobalt%20Neon.toml"

palette:
  background:    "#142838"
  foreground:    "#8ff586"
  black:         "#142631"
  red:           "#ff2320"
  green:         "#3ba5ff"
  yellow:        "#e9e75c"
  blue:          "#8ff586"
  magenta:       "#781aa0"
  cyan:          "#8ff586"
  white:         "#ba46b2"
  bright-black:  "#fff688"
  bright-red:    "#d4312e"
  bright-green:  "#8ff586"
  bright-yellow: "#e9f06d"
  bright-blue:   "#3c7dd2"
  bright-magenta: "#8230a7"
  bright-cyan:   "#6cbc67"
  bright-white:  "#8ff586"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
