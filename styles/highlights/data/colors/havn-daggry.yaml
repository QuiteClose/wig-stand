meta:
  name: Havn Daggry
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Havn%20Daggry.toml"

palette:
  background:    "#f8f9fb"
  foreground:    "#3b4a7a"
  black:         "#1f2842"
  red:           "#985248"
  green:         "#577159"
  yellow:        "#be6b00"
  blue:          "#3a577d"
  magenta:       "#7c5c97"
  cyan:          "#925780"
  white:         "#b0b5c5"
  bright-black:  "#1f2842"
  bright-red:    "#cc4a35"
  bright-green:  "#719679"
  bright-yellow: "#f1a527"
  bright-blue:   "#6089c0"
  bright-magenta: "#7d7396"
  bright-cyan:   "#aa869d"
  bright-white:  "#d6dbeb"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
