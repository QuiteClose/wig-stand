meta:
  name: Chester
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Chester.toml"

palette:
  background:    "#2c3643"
  foreground:    "#ffffff"
  black:         "#080200"
  red:           "#fa5e5b"
  green:         "#16c98d"
  yellow:        "#ffc83f"
  blue:          "#288ad6"
  magenta:       "#d34590"
  cyan:          "#28ddde"
  white:         "#e7e7e7"
  bright-black:  "#6f6b68"
  bright-red:    "#fa5e5b"
  bright-green:  "#16c98d"
  bright-yellow: "#feef6d"
  bright-blue:   "#278ad6"
  bright-magenta: "#d34590"
  bright-cyan:   "#27dede"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
