meta:
  name: ENCOM
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/ENCOM.toml"

palette:
  background:    "#000000"
  foreground:    "#00a595"
  black:         "#000000"
  red:           "#9f0000"
  green:         "#008b00"
  yellow:        "#ffd000"
  blue:          "#0081ff"
  magenta:       "#bc00ca"
  cyan:          "#008b8b"
  white:         "#bbbbbb"
  bright-black:  "#555555"
  bright-red:    "#ff0000"
  bright-green:  "#00ee00"
  bright-yellow: "#ffff00"
  bright-blue:   "#0000ff"
  bright-magenta: "#ff00ff"
  bright-cyan:   "#00cdcd"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
