meta:
  name: Horizon Bright
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Horizon%20Bright.toml"

palette:
  background:    "#fdf0ed"
  foreground:    "#16161d"
  black:         "#16161d"
  red:           "#fc4777"
  green:         "#00ca86"
  yellow:        "#f2a682"
  blue:          "#00bedd"
  magenta:       "#ff58b1"
  cyan:          "#00cdcb"
  white:         "#bfafac"
  bright-black:  "#1a1c24"
  bright-red:    "#fe5f87"
  bright-green:  "#00d193"
  bright-yellow: "#e5a688"
  bright-blue:   "#00c9e2"
  bright-magenta: "#ff6cba"
  bright-cyan:   "#00c3c2"
  bright-white:  "#fff2ef"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
