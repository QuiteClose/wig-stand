meta:
  name: Karma Dark
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Karma%20Dark.toml"

palette:
  background:    "#0a0e14"
  foreground:    "#f7f1ff"
  black:         "#0a0e14"
  red:           "#fc618d"
  green:         "#7bd88f"
  yellow:        "#fce566"
  blue:          "#5ad4e6"
  magenta:       "#af98e6"
  cyan:          "#5ad4e6"
  white:         "#bab6c0"
  bright-black:  "#69676c"
  bright-red:    "#ff7ba0"
  bright-green:  "#9ce3ab"
  bright-yellow: "#fce566"
  bright-blue:   "#7fe0ee"
  bright-magenta: "#c3b0f0"
  bright-cyan:   "#7fe0ee"
  bright-white:  "#f7f1ff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
