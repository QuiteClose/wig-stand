meta:
  name: One Double Dark
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/One%20Double%20Dark.toml"

palette:
  background:    "#282c34"
  foreground:    "#dbdfe5"
  black:         "#3d4452"
  red:           "#f16372"
  green:         "#8cc570"
  yellow:        "#ecbe70"
  blue:          "#3fb1f5"
  magenta:       "#d373e3"
  cyan:          "#17b9c4"
  white:         "#dbdfe5"
  bright-black:  "#525d6f"
  bright-red:    "#ff777b"
  bright-green:  "#82d882"
  bright-yellow: "#f5c065"
  bright-blue:   "#6dcaff"
  bright-magenta: "#ff7bf4"
  bright-cyan:   "#00e5fb"
  bright-white:  "#f7f9fc"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
