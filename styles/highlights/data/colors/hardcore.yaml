meta:
  name: Hardcore
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Hardcore.toml"

palette:
  background:    "#121212"
  foreground:    "#a0a0a0"
  black:         "#1b1d1e"
  red:           "#f92672"
  green:         "#a6e22e"
  yellow:        "#fd971f"
  blue:          "#66d9ef"
  magenta:       "#9e6ffe"
  cyan:          "#5e7175"
  white:         "#ccccc6"
  bright-black:  "#505354"
  bright-red:    "#ff669d"
  bright-green:  "#beed5f"
  bright-yellow: "#e6db74"
  bright-blue:   "#66d9ef"
  bright-magenta: "#9e6ffe"
  bright-cyan:   "#a3babf"
  bright-white:  "#f8f8f2"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
