meta:
  name: The Hulk
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/The%20Hulk.toml"

palette:
  background:    "#1b1d1e"
  foreground:    "#b5b5b5"
  black:         "#1b1d1e"
  red:           "#269d1b"
  green:         "#13ce30"
  yellow:        "#63e457"
  blue:          "#2525f5"
  magenta:       "#712c81"
  cyan:          "#378ca9"
  white:         "#d9d8d1"
  bright-black:  "#505354"
  bright-red:    "#8dff2a"
  bright-green:  "#48ff77"
  bright-yellow: "#3afe16"
  bright-blue:   "#506b95"
  bright-magenta: "#72589d"
  bright-cyan:   "#4085a6"
  bright-white:  "#e5e6e1"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
