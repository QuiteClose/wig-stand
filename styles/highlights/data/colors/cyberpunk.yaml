meta:
  name: Cyberpunk
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Cyberpunk.toml"

palette:
  background:    "#332a57"
  foreground:    "#e5e5e5"
  black:         "#000000"
  red:           "#ff7092"
  green:         "#00fbac"
  yellow:        "#fffa6a"
  blue:          "#00bfff"
  magenta:       "#df95ff"
  cyan:          "#86cbfe"
  white:         "#ffffff"
  bright-black:  "#595959"
  bright-red:    "#ff8aa4"
  bright-green:  "#21f6bc"
  bright-yellow: "#fff787"
  bright-blue:   "#1bccfd"
  bright-magenta: "#e6aefe"
  bright-cyan:   "#99d6fc"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
