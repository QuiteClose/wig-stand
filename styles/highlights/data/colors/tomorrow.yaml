meta:
  name: Tomorrow
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Tomorrow.toml"

palette:
  background:    "#ffffff"
  foreground:    "#4d4d4c"
  black:         "#000000"
  red:           "#c82829"
  green:         "#718c00"
  yellow:        "#eab700"
  blue:          "#4271ae"
  magenta:       "#8959a8"
  cyan:          "#3e999f"
  white:         "#bfbfbf"
  bright-black:  "#000000"
  bright-red:    "#c82829"
  bright-green:  "#718c00"
  bright-yellow: "#eab700"
  bright-blue:   "#4271ae"
  bright-magenta: "#8959a8"
  bright-cyan:   "#3e999f"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
