meta:
  name: Aardvark Blue
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Aardvark%20Blue.toml"

palette:
  background:    "#102040"
  foreground:    "#dddddd"
  black:         "#191919"
  red:           "#aa342e"
  green:         "#4b8c0f"
  yellow:        "#dbba00"
  blue:          "#1370d3"
  magenta:       "#c43ac3"
  cyan:          "#008eb0"
  white:         "#bebebe"
  bright-black:  "#525252"
  bright-red:    "#f05b50"
  bright-green:  "#95dc55"
  bright-yellow: "#ffe763"
  bright-blue:   "#60a4ec"
  bright-magenta: "#e26be2"
  bright-cyan:   "#60b6cb"
  bright-white:  "#f7f7f7"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
