meta:
  name: Builtin Pastel Dark
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Builtin%20Pastel%20Dark.toml"

palette:
  background:    "#000000"
  foreground:    "#bbbbbb"
  black:         "#4f4f4f"
  red:           "#ff6c60"
  green:         "#a8ff60"
  yellow:        "#ffffb6"
  blue:          "#96cbfe"
  magenta:       "#ff73fd"
  cyan:          "#c6c5fe"
  white:         "#eeeeee"
  bright-black:  "#7c7c7c"
  bright-red:    "#ffb6b0"
  bright-green:  "#ceffac"
  bright-yellow: "#ffffcc"
  bright-blue:   "#b5dcff"
  bright-magenta: "#ff9cfe"
  bright-cyan:   "#dfdffe"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
