meta:
  name: Crayon Pony Fish
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Crayon%20Pony%20Fish.toml"

palette:
  background:    "#150707"
  foreground:    "#68525a"
  black:         "#2b1b1d"
  red:           "#91002b"
  green:         "#579524"
  yellow:        "#ab311b"
  blue:          "#8c87b0"
  magenta:       "#692f50"
  cyan:          "#e8a866"
  white:         "#68525a"
  bright-black:  "#4a383b"
  bright-red:    "#c5255d"
  bright-green:  "#8dff57"
  bright-yellow: "#c8381d"
  bright-blue:   "#cfc9ff"
  bright-magenta: "#fc6cba"
  bright-cyan:   "#ffceaf"
  bright-white:  "#b0949d"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
