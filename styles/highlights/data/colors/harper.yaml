meta:
  name: Harper
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Harper.toml"

palette:
  background:    "#010101"
  foreground:    "#a8a49d"
  black:         "#010101"
  red:           "#f8b63f"
  green:         "#7fb5e1"
  yellow:        "#d6da25"
  blue:          "#489e48"
  magenta:       "#b296c6"
  cyan:          "#f5bfd7"
  white:         "#a8a49d"
  bright-black:  "#726e6a"
  bright-red:    "#f8b63f"
  bright-green:  "#7fb5e1"
  bright-yellow: "#d6da25"
  bright-blue:   "#489e48"
  bright-magenta: "#b296c6"
  bright-cyan:   "#f5bfd7"
  bright-white:  "#fefbea"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
