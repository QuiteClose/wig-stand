meta:
  name: Adventure Time
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Adventure%20Time.toml"

palette:
  background:    "#1f1d45"
  foreground:    "#f8dcc0"
  black:         "#050404"
  red:           "#bd0013"
  green:         "#4ab118"
  yellow:        "#e7741e"
  blue:          "#0f4ac6"
  magenta:       "#665993"
  cyan:          "#70a598"
  white:         "#f8dcc0"
  bright-black:  "#4e7cbf"
  bright-red:    "#fc5f5a"
  bright-green:  "#9eff6e"
  bright-yellow: "#efc11a"
  bright-blue:   "#1997c6"
  bright-magenta: "#9b5953"
  bright-cyan:   "#c8faf4"
  bright-white:  "#f6f5fb"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
