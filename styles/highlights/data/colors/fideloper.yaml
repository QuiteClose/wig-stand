meta:
  name: Fideloper
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Fideloper.toml"

palette:
  background:    "#292f33"
  foreground:    "#dbdae0"
  black:         "#292f33"
  red:           "#cb1e2d"
  green:         "#edb8ac"
  yellow:        "#b7ab9b"
  blue:          "#2e78c2"
  magenta:       "#c0236f"
  cyan:          "#309186"
  white:         "#eae3ce"
  bright-black:  "#496068"
  bright-red:    "#d4605a"
  bright-green:  "#d4605a"
  bright-yellow: "#a86671"
  bright-blue:   "#7c85c4"
  bright-magenta: "#5c5db2"
  bright-cyan:   "#819090"
  bright-white:  "#fcf4df"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
