meta:
  name: Doom One
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Doom%20One.toml"

palette:
  background:    "#282c34"
  foreground:    "#bbc2cf"
  black:         "#000000"
  red:           "#ff6c6b"
  green:         "#98be65"
  yellow:        "#ecbe7b"
  blue:          "#a9a1e1"
  magenta:       "#c678dd"
  cyan:          "#51afef"
  white:         "#bbc2cf"
  bright-black:  "#595959"
  bright-red:    "#ff6655"
  bright-green:  "#99bb66"
  bright-yellow: "#ecbe7b"
  bright-blue:   "#a9a1e1"
  bright-magenta: "#c678dd"
  bright-cyan:   "#51afef"
  bright-white:  "#bfbfbf"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
