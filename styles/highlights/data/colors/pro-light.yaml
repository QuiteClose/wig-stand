meta:
  name: Pro Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Pro%20Light.toml"

palette:
  background:    "#ffffff"
  foreground:    "#191919"
  black:         "#000000"
  red:           "#e5492b"
  green:         "#50d148"
  yellow:        "#c6c440"
  blue:          "#3b75ff"
  magenta:       "#ed66e8"
  cyan:          "#4ed2de"
  white:         "#c2c2c2"
  bright-black:  "#9f9f9f"
  bright-red:    "#ff6640"
  bright-green:  "#48d53e"
  bright-yellow: "#bfbe23"
  bright-blue:   "#0082ff"
  bright-magenta: "#ff7eff"
  bright-cyan:   "#3bd1d2"
  bright-white:  "#f2f2f2"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
