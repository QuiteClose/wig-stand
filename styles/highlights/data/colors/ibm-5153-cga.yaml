meta:
  name: IBM 5153 CGA
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/IBM%205153%20CGA.toml"

palette:
  background:    "#141414"
  foreground:    "#cecece"
  black:         "#141414"
  red:           "#d03333"
  green:         "#1bd01b"
  yellow:        "#d08c1b"
  blue:          "#1b1bd0"
  magenta:       "#d01bd0"
  cyan:          "#1bd0d0"
  white:         "#cecece"
  bright-black:  "#4e4e4e"
  bright-red:    "#dc4e4e"
  bright-green:  "#4edc4e"
  bright-yellow: "#f3f34e"
  bright-blue:   "#4e4edc"
  bright-magenta: "#f34ef3"
  bright-cyan:   "#4ef3f3"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
