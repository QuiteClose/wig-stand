meta:
  name: GitLab Dark Grey
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/GitLab%20Dark%20Grey.toml"

palette:
  background:    "#222222"
  foreground:    "#ffffff"
  black:         "#000000"
  red:           "#f57f6c"
  green:         "#52b87a"
  yellow:        "#d99530"
  blue:          "#7fb6ed"
  magenta:       "#f88aaf"
  cyan:          "#32c5d2"
  white:         "#ffffff"
  bright-black:  "#666666"
  bright-red:    "#fcb5aa"
  bright-green:  "#91d4a8"
  bright-yellow: "#e9be74"
  bright-blue:   "#498dd1"
  bright-magenta: "#fcacc5"
  bright-cyan:   "#5edee3"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
