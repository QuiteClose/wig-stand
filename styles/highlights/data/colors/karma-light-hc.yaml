meta:
  name: Karma Light HC
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Karma%20Light%20HC.toml"

palette:
  background:    "#ffffff"
  foreground:    "#000000"
  black:         "#000000"
  red:           "#c01650"
  green:         "#1a6e1c"
  yellow:        "#9c6800"
  blue:          "#2f5e9e"
  magenta:       "#4d2d9a"
  cyan:          "#2f5e9e"
  white:         "#2e2c30"
  bright-black:  "#999999"
  bright-red:    "#c01650"
  bright-green:  "#1a6e1c"
  bright-yellow: "#9c6800"
  bright-blue:   "#2f5e9e"
  bright-magenta: "#4d2d9a"
  bright-cyan:   "#2f5e9e"
  bright-white:  "#0a0e14"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
