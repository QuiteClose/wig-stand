meta:
  name: Monokai Pro Machine
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Monokai%20Pro%20Machine.toml"

palette:
  background:    "#273136"
  foreground:    "#f2fffc"
  black:         "#273136"
  red:           "#ff6d7e"
  green:         "#a2e57b"
  yellow:        "#ffed72"
  blue:          "#ffb270"
  magenta:       "#baa0f8"
  cyan:          "#7cd5f1"
  white:         "#f2fffc"
  bright-black:  "#6b7678"
  bright-red:    "#ff6d7e"
  bright-green:  "#a2e57b"
  bright-yellow: "#ffed72"
  bright-blue:   "#ffb270"
  bright-magenta: "#baa0f8"
  bright-cyan:   "#7cd5f1"
  bright-white:  "#f2fffc"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
