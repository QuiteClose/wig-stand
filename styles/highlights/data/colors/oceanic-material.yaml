meta:
  name: Oceanic Material
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Oceanic%20Material.toml"

palette:
  background:    "#1c262b"
  foreground:    "#c2c8d7"
  black:         "#000000"
  red:           "#ee2b2a"
  green:         "#40a33f"
  yellow:        "#ffea2e"
  blue:          "#1e80f0"
  magenta:       "#8800a0"
  cyan:          "#16afca"
  white:         "#a4a4a4"
  bright-black:  "#777777"
  bright-red:    "#dc5c60"
  bright-green:  "#70be71"
  bright-yellow: "#fff163"
  bright-blue:   "#54a4f3"
  bright-magenta: "#aa4dbc"
  bright-cyan:   "#42c7da"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
