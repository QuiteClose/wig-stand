meta:
  name: Cobalt2
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Cobalt2.toml"

palette:
  background:    "#132738"
  foreground:    "#ffffff"
  black:         "#000000"
  red:           "#ff0000"
  green:         "#38de21"
  yellow:        "#ffe50a"
  blue:          "#1460d2"
  magenta:       "#ff005d"
  cyan:          "#00bbbb"
  white:         "#bbbbbb"
  bright-black:  "#555555"
  bright-red:    "#f40e17"
  bright-green:  "#3bd01d"
  bright-yellow: "#edc809"
  bright-blue:   "#5555ff"
  bright-magenta: "#ff55ff"
  bright-cyan:   "#6ae3fa"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
