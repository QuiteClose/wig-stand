meta:
  name: Floraverse
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Floraverse.toml"

palette:
  background:    "#0e0d15"
  foreground:    "#dbd1b9"
  black:         "#08002e"
  red:           "#7e1a46"
  green:         "#5d731a"
  yellow:        "#cd751c"
  blue:          "#1d6da1"
  magenta:       "#b7077e"
  cyan:          "#42a38c"
  white:         "#f3e0b8"
  bright-black:  "#4c3866"
  bright-red:    "#d02063"
  bright-green:  "#b4ce59"
  bright-yellow: "#fac357"
  bright-blue:   "#40a4cf"
  bright-magenta: "#f12aae"
  bright-cyan:   "#62caa8"
  bright-white:  "#fff5db"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
