meta:
  name: Iceberg Dark
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Iceberg%20Dark.toml"

palette:
  background:    "#161821"
  foreground:    "#c6c8d1"
  black:         "#1e2132"
  red:           "#e27878"
  green:         "#b4be82"
  yellow:        "#e2a478"
  blue:          "#84a0c6"
  magenta:       "#a093c7"
  cyan:          "#89b8c2"
  white:         "#c6c8d1"
  bright-black:  "#6b7089"
  bright-red:    "#e98989"
  bright-green:  "#c0ca8e"
  bright-yellow: "#e9b189"
  bright-blue:   "#91acd1"
  bright-magenta: "#ada0d3"
  bright-cyan:   "#95c4ce"
  bright-white:  "#d2d4de"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
