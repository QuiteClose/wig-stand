meta:
  name: Konsolas
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Konsolas.toml"

palette:
  background:    "#060606"
  foreground:    "#c8c1c1"
  black:         "#000000"
  red:           "#aa1717"
  green:         "#18b218"
  yellow:        "#ebae1f"
  blue:          "#2323a5"
  magenta:       "#ad1edc"
  cyan:          "#42b0c8"
  white:         "#c8c1c1"
  bright-black:  "#7b716e"
  bright-red:    "#ff4141"
  bright-green:  "#5fff5f"
  bright-yellow: "#ffff55"
  bright-blue:   "#4b4bff"
  bright-magenta: "#ff54ff"
  bright-cyan:   "#69ffff"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
