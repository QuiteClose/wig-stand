meta:
  name: Wilmersdorf
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Wilmersdorf.toml"

palette:
  background:    "#282b33"
  foreground:    "#c6c6c6"
  black:         "#34373e"
  red:           "#e06383"
  green:         "#7ebebd"
  yellow:        "#cccccc"
  blue:          "#a6c1e0"
  magenta:       "#e1c1ee"
  cyan:          "#5b94ab"
  white:         "#ababab"
  bright-black:  "#50545d"
  bright-red:    "#fa7193"
  bright-green:  "#8fd7d6"
  bright-yellow: "#d1dfff"
  bright-blue:   "#b2cff0"
  bright-magenta: "#efccfd"
  bright-cyan:   "#69abc5"
  bright-white:  "#d3d3d3"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
