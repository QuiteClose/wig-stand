meta:
  name: Fun Forrest
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Fun%20Forrest.toml"

palette:
  background:    "#251200"
  foreground:    "#dec165"
  black:         "#000000"
  red:           "#d6262b"
  green:         "#919c00"
  yellow:        "#be8a13"
  blue:          "#4699a3"
  magenta:       "#8d4331"
  cyan:          "#da8213"
  white:         "#ddc265"
  bright-black:  "#7f6a55"
  bright-red:    "#e55a1c"
  bright-green:  "#bfc65a"
  bright-yellow: "#ffcb1b"
  bright-blue:   "#7cc9cf"
  bright-magenta: "#d26349"
  bright-cyan:   "#e6a96b"
  bright-white:  "#ffeaa3"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
