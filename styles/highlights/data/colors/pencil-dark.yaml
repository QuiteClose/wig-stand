meta:
  name: Pencil Dark
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Pencil%20Dark.toml"

palette:
  background:    "#212121"
  foreground:    "#f1f1f1"
  black:         "#212121"
  red:           "#c30771"
  green:         "#10a778"
  yellow:        "#a89c14"
  blue:          "#008ec4"
  magenta:       "#5f4986"
  cyan:          "#20a5ba"
  white:         "#d9d9d9"
  bright-black:  "#4f4f4f"
  bright-red:    "#fb007a"
  bright-green:  "#5fd7af"
  bright-yellow: "#f3e430"
  bright-blue:   "#20bbfc"
  bright-magenta: "#6855de"
  bright-cyan:   "#4fb8cc"
  bright-white:  "#f1f1f1"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
