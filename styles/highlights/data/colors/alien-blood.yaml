meta:
  name: Alien Blood
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Alien%20Blood.toml"

palette:
  background:    "#0f1610"
  foreground:    "#637d75"
  black:         "#112616"
  red:           "#7f2b27"
  green:         "#2f7e25"
  yellow:        "#717f24"
  blue:          "#2f6a7f"
  magenta:       "#47587f"
  cyan:          "#327f77"
  white:         "#647d75"
  bright-black:  "#3c4812"
  bright-red:    "#e08009"
  bright-green:  "#18e000"
  bright-yellow: "#bde000"
  bright-blue:   "#00aae0"
  bright-magenta: "#0058e0"
  bright-cyan:   "#00e0c4"
  bright-white:  "#73fa91"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
