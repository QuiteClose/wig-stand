meta:
  name: Vague
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Vague.toml"

palette:
  background:    "#141415"
  foreground:    "#cdcdcd"
  black:         "#252530"
  red:           "#d8647e"
  green:         "#7fa563"
  yellow:        "#f3be7c"
  blue:          "#6e94b2"
  magenta:       "#bb9dbd"
  cyan:          "#aeaed1"
  white:         "#cdcdcd"
  bright-black:  "#606079"
  bright-red:    "#e08398"
  bright-green:  "#99b782"
  bright-yellow: "#f5cb96"
  bright-blue:   "#8ba9c1"
  bright-magenta: "#c9b1ca"
  bright-cyan:   "#bebeda"
  bright-white:  "#d7d7d7"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
