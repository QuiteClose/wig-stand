meta:
  name: Monokai Soda
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Monokai%20Soda.toml"

palette:
  background:    "#1a1a1a"
  foreground:    "#c4c5b5"
  black:         "#1a1a1a"
  red:           "#f4005f"
  green:         "#98e024"
  yellow:        "#fa8419"
  blue:          "#9d65ff"
  magenta:       "#f4005f"
  cyan:          "#58d1eb"
  white:         "#c4c5b5"
  bright-black:  "#625e4c"
  bright-red:    "#f4005f"
  bright-green:  "#98e024"
  bright-yellow: "#e0d561"
  bright-blue:   "#9d65ff"
  bright-magenta: "#f4005f"
  bright-cyan:   "#58d1eb"
  bright-white:  "#f6f6ef"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
