meta:
  name: Later This Evening
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Later%20This%20Evening.toml"

palette:
  background:    "#222222"
  foreground:    "#959595"
  black:         "#2b2b2b"
  red:           "#d45a60"
  green:         "#afba67"
  yellow:        "#e5d289"
  blue:          "#a0bad6"
  magenta:       "#c092d6"
  cyan:          "#91bfb7"
  white:         "#494a4a"
  bright-black:  "#525454"
  bright-red:    "#d3232f"
  bright-green:  "#aabb39"
  bright-yellow: "#e5be39"
  bright-blue:   "#6699d6"
  bright-magenta: "#ab53d6"
  bright-cyan:   "#5fc0ae"
  bright-white:  "#c1c2c2"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
