meta:
  name: 3024 Night
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/3024%20Night.toml"

palette:
  background:    "#090300"
  foreground:    "#a5a2a2"
  black:         "#090300"
  red:           "#db2d20"
  green:         "#01a252"
  yellow:        "#fded02"
  blue:          "#01a0e4"
  magenta:       "#a16a94"
  cyan:          "#b5e4f4"
  white:         "#a5a2a2"
  bright-black:  "#5c5855"
  bright-red:    "#e8bbd0"
  bright-green:  "#47413f"
  bright-yellow: "#4a4543"
  bright-blue:   "#807d7c"
  bright-magenta: "#d6d5d4"
  bright-cyan:   "#cdab53"
  bright-white:  "#f7f7f7"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
