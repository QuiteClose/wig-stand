meta:
  name: Monokai Pro Octagon
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Monokai%20Pro%20Octagon.toml"

palette:
  background:    "#282a3a"
  foreground:    "#eaf2f1"
  black:         "#282a3a"
  red:           "#ff657a"
  green:         "#bad761"
  yellow:        "#ffd76d"
  blue:          "#ff9b5e"
  magenta:       "#c39ac9"
  cyan:          "#9cd1bb"
  white:         "#eaf2f1"
  bright-black:  "#696d77"
  bright-red:    "#ff657a"
  bright-green:  "#bad761"
  bright-yellow: "#ffd76d"
  bright-blue:   "#ff9b5e"
  bright-magenta: "#c39ac9"
  bright-cyan:   "#9cd1bb"
  bright-white:  "#eaf2f1"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
