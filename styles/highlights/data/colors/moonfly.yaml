meta:
  name: Moonfly
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Moonfly.toml"

palette:
  background:    "#080808"
  foreground:    "#bdbdbd"
  black:         "#323437"
  red:           "#ff5454"
  green:         "#8cc85f"
  yellow:        "#e3c78a"
  blue:          "#80a0ff"
  magenta:       "#cf87e8"
  cyan:          "#79dac8"
  white:         "#c6c6c6"
  bright-black:  "#949494"
  bright-red:    "#ff5189"
  bright-green:  "#36c692"
  bright-yellow: "#c6c684"
  bright-blue:   "#74b2ff"
  bright-magenta: "#ae81ff"
  bright-cyan:   "#85dc85"
  bright-white:  "#e4e4e4"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
