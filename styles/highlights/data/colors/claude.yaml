meta:
  name: Claude
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Claude.toml"

palette:
  background:    "#faf9f5"
  foreground:    "#141413"
  black:         "#c15f3c"
  red:           "#788c5d"
  green:         "#b16803"
  yellow:        "#6a9bcc"
  blue:          "#8b6cb0"
  magenta:       "#2e8b8b"
  cyan:          "#b5b3a9"
  white:         "#3d3d3c"
  bright-black:  "#d97757"
  bright-red:    "#8fa86b"
  bright-green:  "#d4952b"
  bright-yellow: "#7bafd4"
  bright-blue:   "#a080c8"
  bright-magenta: "#4eaaaa"
  bright-cyan:   "#bab9b5"
  bright-white:  "#141413"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
