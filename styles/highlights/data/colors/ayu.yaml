meta:
  name: Ayu
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Ayu.toml"

palette:
  background:    "#0b0e14"
  foreground:    "#bfbdb6"
  black:         "#11151c"
  red:           "#ea6c73"
  green:         "#7fd962"
  yellow:        "#f9af4f"
  blue:          "#53bdfa"
  magenta:       "#cda1fa"
  cyan:          "#90e1c6"
  white:         "#c7c7c7"
  bright-black:  "#686868"
  bright-red:    "#f07178"
  bright-green:  "#aad94c"
  bright-yellow: "#ffb454"
  bright-blue:   "#59c2ff"
  bright-magenta: "#d2a6ff"
  bright-cyan:   "#95e6cb"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
