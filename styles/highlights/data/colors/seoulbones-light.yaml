meta:
  name: Seoulbones Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Seoulbones%20Light.toml"

palette:
  background:    "#e2e2e2"
  foreground:    "#555555"
  black:         "#e2e2e2"
  red:           "#dc5284"
  green:         "#628562"
  yellow:        "#c48562"
  blue:          "#0084a3"
  magenta:       "#896788"
  cyan:          "#008586"
  white:         "#555555"
  bright-black:  "#a5a0a1"
  bright-red:    "#be3c6d"
  bright-green:  "#487249"
  bright-yellow: "#a76b48"
  bright-blue:   "#006f89"
  bright-magenta: "#7f4c7e"
  bright-cyan:   "#006f70"
  bright-white:  "#777777"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
