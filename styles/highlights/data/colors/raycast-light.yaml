meta:
  name: Raycast Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Raycast%20Light.toml"

palette:
  background:    "#ffffff"
  foreground:    "#000000"
  black:         "#000000"
  red:           "#b12424"
  green:         "#006b4f"
  yellow:        "#f8a300"
  blue:          "#138af2"
  magenta:       "#9a1b6e"
  cyan:          "#3eb8bf"
  white:         "#bfbfbf"
  bright-black:  "#000000"
  bright-red:    "#b12424"
  bright-green:  "#006b4f"
  bright-yellow: "#f8a300"
  bright-blue:   "#138af2"
  bright-magenta: "#9a1b6e"
  bright-cyan:   "#3eb8bf"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
