meta:
  name: One Half Dark
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/One%20Half%20Dark.toml"

palette:
  background:    "#282c34"
  foreground:    "#dcdfe4"
  black:         "#282c34"
  red:           "#e06c75"
  green:         "#98c379"
  yellow:        "#e5c07b"
  blue:          "#61afef"
  magenta:       "#c678dd"
  cyan:          "#56b6c2"
  white:         "#dcdfe4"
  bright-black:  "#5d677a"
  bright-red:    "#e06c75"
  bright-green:  "#98c379"
  bright-yellow: "#e5c07b"
  bright-blue:   "#61afef"
  bright-magenta: "#c678dd"
  bright-cyan:   "#56b6c2"
  bright-white:  "#dcdfe4"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
