meta:
  name: Selenized Dark
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Selenized%20Dark.toml"

palette:
  background:    "#103c48"
  foreground:    "#adbcbc"
  black:         "#184956"
  red:           "#fa5750"
  green:         "#75b938"
  yellow:        "#dbb32d"
  blue:          "#4695f7"
  magenta:       "#f275be"
  cyan:          "#41c7b9"
  white:         "#adbcbc"
  bright-black:  "#72898f"
  bright-red:    "#ff665c"
  bright-green:  "#84c747"
  bright-yellow: "#ebc13d"
  bright-blue:   "#58a3ff"
  bright-magenta: "#ff84cd"
  bright-cyan:   "#53d6c7"
  bright-white:  "#cad8d9"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
