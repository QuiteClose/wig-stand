meta:
  name: Xcode Dark hc
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Xcode%20Dark%20hc.toml"

palette:
  background:    "#1f1f24"
  foreground:    "#ffffff"
  black:         "#43454b"
  red:           "#ff8a7a"
  green:         "#83c9bc"
  yellow:        "#d9c668"
  blue:          "#4ec4e6"
  magenta:       "#ff85b8"
  cyan:          "#cda1ff"
  white:         "#ffffff"
  bright-black:  "#838991"
  bright-red:    "#ff8a7a"
  bright-green:  "#b1faeb"
  bright-yellow: "#ffa14f"
  bright-blue:   "#6bdfff"
  bright-magenta: "#ff85b8"
  bright-cyan:   "#e5cfff"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
