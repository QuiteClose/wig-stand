meta:
  name: Duckbones
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Duckbones.toml"

palette:
  background:    "#0e101a"
  foreground:    "#ebefc0"
  black:         "#0e101a"
  red:           "#e03600"
  green:         "#5dcd97"
  yellow:        "#e39500"
  blue:          "#00a3cb"
  magenta:       "#795ccc"
  cyan:          "#00a3cb"
  white:         "#ebefc0"
  bright-black:  "#444860"
  bright-red:    "#ff4821"
  bright-green:  "#58db9e"
  bright-yellow: "#f6a100"
  bright-blue:   "#00b4e0"
  bright-magenta: "#b3a1e6"
  bright-cyan:   "#00b4e0"
  bright-white:  "#b3b692"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
