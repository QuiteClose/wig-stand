meta:
  name: Cyberdyne
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Cyberdyne.toml"

palette:
  background:    "#151144"
  foreground:    "#00ff92"
  black:         "#080808"
  red:           "#ff8373"
  green:         "#00c172"
  yellow:        "#d2a700"
  blue:          "#0071cf"
  magenta:       "#ff90fe"
  cyan:          "#6bffdd"
  white:         "#f1f1f1"
  bright-black:  "#484848"
  bright-red:    "#ffc4be"
  bright-green:  "#d6fcba"
  bright-yellow: "#fffed5"
  bright-blue:   "#c2e3ff"
  bright-magenta: "#ffb2fe"
  bright-cyan:   "#e6e7fe"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
