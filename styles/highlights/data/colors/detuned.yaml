meta:
  name: Detuned
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Detuned.toml"

palette:
  background:    "#000000"
  foreground:    "#c7c7c7"
  black:         "#171717"
  red:           "#fe4386"
  green:         "#a6e32d"
  yellow:        "#e6da73"
  blue:          "#0094d9"
  magenta:       "#9b37ff"
  cyan:          "#50b7d9"
  white:         "#c7c7c7"
  bright-black:  "#686868"
  bright-red:    "#fa80ac"
  bright-green:  "#bde371"
  bright-yellow: "#fff27f"
  bright-blue:   "#00beff"
  bright-magenta: "#be9eff"
  bright-cyan:   "#5ed7ff"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
