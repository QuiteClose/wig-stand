meta:
  name: One Dark Two
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/One%20Dark%20Two.toml"

palette:
  background:    "#21252b"
  foreground:    "#e6e6e6"
  black:         "#1d1f23"
  red:           "#e27881"
  green:         "#98c379"
  yellow:        "#eac786"
  blue:          "#71b9f4"
  magenta:       "#c88bda"
  cyan:          "#62bac6"
  white:         "#c9ccd3"
  bright-black:  "#4a505a"
  bright-red:    "#e68991"
  bright-green:  "#a8cc8e"
  bright-yellow: "#edcf97"
  bright-blue:   "#8dc7f6"
  bright-magenta: "#d3a2e2"
  bright-cyan:   "#78c4ce"
  bright-white:  "#e6e6e6"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
