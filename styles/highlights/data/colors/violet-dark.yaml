meta:
  name: Violet Dark
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Violet%20Dark.toml"

palette:
  background:    "#1c1d1f"
  foreground:    "#708284"
  black:         "#56595c"
  red:           "#c94c22"
  green:         "#85981c"
  yellow:        "#b4881d"
  blue:          "#2e8bce"
  magenta:       "#d13a82"
  cyan:          "#32a198"
  white:         "#c9c6bd"
  bright-black:  "#45484b"
  bright-red:    "#bd3613"
  bright-green:  "#738a04"
  bright-yellow: "#a57705"
  bright-blue:   "#2176c7"
  bright-magenta: "#c61c6f"
  bright-cyan:   "#259286"
  bright-white:  "#c9c6bd"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
