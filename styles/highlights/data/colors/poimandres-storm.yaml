meta:
  name: Poimandres Storm
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Poimandres%20Storm.toml"

palette:
  background:    "#252b37"
  foreground:    "#a6accd"
  black:         "#252b37"
  red:           "#d0679d"
  green:         "#5de4c7"
  yellow:        "#fffac2"
  blue:          "#89ddff"
  magenta:       "#f087bd"
  cyan:          "#89ddff"
  white:         "#ffffff"
  bright-black:  "#a6accd"
  bright-red:    "#d0679d"
  bright-green:  "#5de4c7"
  bright-yellow: "#fffac2"
  bright-blue:   "#add7ff"
  bright-magenta: "#f087bd"
  bright-cyan:   "#add7ff"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
