meta:
  name: Karasu Night
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Karasu%20Night.toml"

palette:
  background:    "#0a0a0a"
  foreground:    "#e7e5e4"
  black:         "#0a0a0a"
  red:           "#e06c75"
  green:         "#8fbf7a"
  yellow:        "#d4b86a"
  blue:          "#7aa2c8"
  magenta:       "#b4a1d8"
  cyan:          "#76b7b2"
  white:         "#f5f5f5"
  bright-black:  "#44403c"
  bright-red:    "#ff5c5c"
  bright-green:  "#a6d189"
  bright-yellow: "#e8d07d"
  bright-blue:   "#8cb4e2"
  bright-magenta: "#c7b3ee"
  bright-cyan:   "#8ad4ce"
  bright-white:  "#e7e5e4"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
