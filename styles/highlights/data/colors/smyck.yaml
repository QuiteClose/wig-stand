meta:
  name: Smyck
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Smyck.toml"

palette:
  background:    "#1b1b1b"
  foreground:    "#f7f7f7"
  black:         "#000000"
  red:           "#b84131"
  green:         "#7da900"
  yellow:        "#c4a500"
  blue:          "#62a3c4"
  magenta:       "#ba8acc"
  cyan:          "#207383"
  white:         "#a1a1a1"
  bright-black:  "#7a7a7a"
  bright-red:    "#d6837c"
  bright-green:  "#c4f137"
  bright-yellow: "#fee14d"
  bright-blue:   "#8dcff0"
  bright-magenta: "#f79aff"
  bright-cyan:   "#6ad9cf"
  bright-white:  "#f7f7f7"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
