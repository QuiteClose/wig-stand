meta:
  name: Purplepeter
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Purplepeter.toml"

palette:
  background:    "#2a1a4a"
  foreground:    "#ece7fa"
  black:         "#0a0520"
  red:           "#ff796d"
  green:         "#99b481"
  yellow:        "#efdfac"
  blue:          "#66d9ef"
  magenta:       "#e78fcd"
  cyan:          "#ba8cff"
  white:         "#ffba81"
  bright-black:  "#504b63"
  bright-red:    "#f99f92"
  bright-green:  "#b4be8f"
  bright-yellow: "#f2e9bf"
  bright-blue:   "#79daed"
  bright-magenta: "#ba91d4"
  bright-cyan:   "#a0a0d6"
  bright-white:  "#b9aed3"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
