meta:
  name: Jubi
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Jubi.toml"

palette:
  background:    "#262b33"
  foreground:    "#c3d3de"
  black:         "#3b3750"
  red:           "#cf7b98"
  green:         "#90a94b"
  yellow:        "#6ebfc0"
  blue:          "#576ea6"
  magenta:       "#bc4f68"
  cyan:          "#75a7d2"
  white:         "#c3d3de"
  bright-black:  "#a874ce"
  bright-red:    "#de90ab"
  bright-green:  "#bcdd61"
  bright-yellow: "#87e9ea"
  bright-blue:   "#8c9fcd"
  bright-magenta: "#e16c87"
  bright-cyan:   "#b7c9ef"
  bright-white:  "#d5e5f1"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
