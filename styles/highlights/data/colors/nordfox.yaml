meta:
  name: Nordfox
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Nordfox.toml"

palette:
  background:    "#2e3440"
  foreground:    "#cdcecf"
  black:         "#3b4252"
  red:           "#bf616a"
  green:         "#a3be8c"
  yellow:        "#ebcb8b"
  blue:          "#81a1c1"
  magenta:       "#b48ead"
  cyan:          "#88c0d0"
  white:         "#e5e9f0"
  bright-black:  "#53648d"
  bright-red:    "#d06f79"
  bright-green:  "#b1d196"
  bright-yellow: "#f0d399"
  bright-blue:   "#8cafd2"
  bright-magenta: "#c895bf"
  bright-cyan:   "#93ccdc"
  bright-white:  "#e7ecf4"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
