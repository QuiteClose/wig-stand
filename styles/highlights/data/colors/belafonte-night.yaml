meta:
  name: Belafonte Night
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Belafonte%20Night.toml"

palette:
  background:    "#20111b"
  foreground:    "#968c83"
  black:         "#20111b"
  red:           "#be100e"
  green:         "#858162"
  yellow:        "#eaa549"
  blue:          "#426a79"
  magenta:       "#97522c"
  cyan:          "#989a9c"
  white:         "#968c83"
  bright-black:  "#5e5252"
  bright-red:    "#be100e"
  bright-green:  "#858162"
  bright-yellow: "#eaa549"
  bright-blue:   "#426a79"
  bright-magenta: "#97522c"
  bright-cyan:   "#989a9c"
  bright-white:  "#d5ccba"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
