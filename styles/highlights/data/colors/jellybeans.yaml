meta:
  name: Jellybeans
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Jellybeans.toml"

palette:
  background:    "#121212"
  foreground:    "#dedede"
  black:         "#929292"
  red:           "#e27373"
  green:         "#94b979"
  yellow:        "#ffba7b"
  blue:          "#97bedc"
  magenta:       "#e1c0fa"
  cyan:          "#00988e"
  white:         "#dedede"
  bright-black:  "#bdbdbd"
  bright-red:    "#ffa1a1"
  bright-green:  "#bddeab"
  bright-yellow: "#ffdca0"
  bright-blue:   "#b1d8f6"
  bright-magenta: "#fbdaff"
  bright-cyan:   "#1ab2a8"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
