meta:
  name: Catppuccin Mocha
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Catppuccin%20Mocha.toml"

palette:
  background:    "#1e1e2e"
  foreground:    "#cdd6f4"
  black:         "#45475a"
  red:           "#f38ba8"
  green:         "#a6e3a1"
  yellow:        "#f9e2af"
  blue:          "#89b4fa"
  magenta:       "#f5c2e7"
  cyan:          "#94e2d5"
  white:         "#a6adc8"
  bright-black:  "#585b70"
  bright-red:    "#f37799"
  bright-green:  "#89d88b"
  bright-yellow: "#ebd391"
  bright-blue:   "#74a8fc"
  bright-magenta: "#f2aede"
  bright-cyan:   "#6bd7ca"
  bright-white:  "#bac2de"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
