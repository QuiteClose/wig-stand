meta:
  name: Sauber
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Sauber.toml"

palette:
  background:    "#ecffe5"
  foreground:    "#1345f6"
  black:         "#14191e"
  red:           "#b43c2a"
  green:         "#00c200"
  yellow:        "#c7c400"
  blue:          "#2744c7"
  magenta:       "#c040be"
  cyan:          "#00c5c7"
  white:         "#bababa"
  bright-black:  "#686868"
  bright-red:    "#dd7975"
  bright-green:  "#3fcd76"
  bright-yellow: "#c6bb00"
  bright-blue:   "#a7abf2"
  bright-magenta: "#e17ee1"
  bright-cyan:   "#048b8f"
  bright-white:  "#a4801c"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
