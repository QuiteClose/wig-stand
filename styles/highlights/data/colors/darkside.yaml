meta:
  name: Darkside
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Darkside.toml"

palette:
  background:    "#222324"
  foreground:    "#bababa"
  black:         "#000000"
  red:           "#e8341c"
  green:         "#68c256"
  yellow:        "#f2d42c"
  blue:          "#1c98e8"
  magenta:       "#8e69c9"
  cyan:          "#1c98e8"
  white:         "#bababa"
  bright-black:  "#4c4c4c"
  bright-red:    "#e05a4f"
  bright-green:  "#77b869"
  bright-yellow: "#efd64b"
  bright-blue:   "#387cd3"
  bright-magenta: "#957bbe"
  bright-cyan:   "#3d97e2"
  bright-white:  "#bababa"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
