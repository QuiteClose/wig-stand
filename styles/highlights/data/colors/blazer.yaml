meta:
  name: Blazer
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Blazer.toml"

palette:
  background:    "#0d1926"
  foreground:    "#d9e6f2"
  black:         "#000000"
  red:           "#b87a7a"
  green:         "#7ab87a"
  yellow:        "#b8b87a"
  blue:          "#7a7ab8"
  magenta:       "#b87ab8"
  cyan:          "#7ab8b8"
  white:         "#d9d9d9"
  bright-black:  "#4c4c4c"
  bright-red:    "#dbbdbd"
  bright-green:  "#bddbbd"
  bright-yellow: "#dbdbbd"
  bright-blue:   "#bdbddb"
  bright-magenta: "#dbbddb"
  bright-cyan:   "#bddbdb"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
