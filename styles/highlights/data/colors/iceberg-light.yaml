meta:
  name: Iceberg Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Iceberg%20Light.toml"

palette:
  background:    "#e8e9ec"
  foreground:    "#33374c"
  black:         "#dcdfe7"
  red:           "#cc517a"
  green:         "#668e3d"
  yellow:        "#c57339"
  blue:          "#2d539e"
  magenta:       "#7759b4"
  cyan:          "#3f83a6"
  white:         "#33374c"
  bright-black:  "#8389a3"
  bright-red:    "#cc3768"
  bright-green:  "#598030"
  bright-yellow: "#b6662d"
  bright-blue:   "#22478e"
  bright-magenta: "#6845ad"
  bright-cyan:   "#327698"
  bright-white:  "#262a3f"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
