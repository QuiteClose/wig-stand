meta:
  name: CLRS
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/CLRS.toml"

palette:
  background:    "#ffffff"
  foreground:    "#262626"
  black:         "#000000"
  red:           "#f8282a"
  green:         "#328a5d"
  yellow:        "#fa701d"
  blue:          "#135cd0"
  magenta:       "#9f00bd"
  cyan:          "#33c3c1"
  white:         "#b3b3b3"
  bright-black:  "#555753"
  bright-red:    "#fb0416"
  bright-green:  "#2cc631"
  bright-yellow: "#e3bd0e"
  bright-blue:   "#1670ff"
  bright-magenta: "#e900b0"
  bright-cyan:   "#3ad5ce"
  bright-white:  "#eeeeec"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
