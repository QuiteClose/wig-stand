meta:
  name: Rose Pine
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Rose%20Pine.toml"

palette:
  background:    "#191724"
  foreground:    "#e0def4"
  black:         "#26233a"
  red:           "#eb6f92"
  green:         "#31748f"
  yellow:        "#f6c177"
  blue:          "#9ccfd8"
  magenta:       "#c4a7e7"
  cyan:          "#ebbcba"
  white:         "#e0def4"
  bright-black:  "#6e6a86"
  bright-red:    "#eb6f92"
  bright-green:  "#31748f"
  bright-yellow: "#f6c177"
  bright-blue:   "#9ccfd8"
  bright-magenta: "#c4a7e7"
  bright-cyan:   "#ebbcba"
  bright-white:  "#e0def4"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
