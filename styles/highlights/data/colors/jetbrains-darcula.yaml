meta:
  name: JetBrains Darcula
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/JetBrains%20Darcula.toml"

palette:
  background:    "#202020"
  foreground:    "#adadad"
  black:         "#000000"
  red:           "#fa5355"
  green:         "#126e00"
  yellow:        "#c2c300"
  blue:          "#4581eb"
  magenta:       "#fa54ff"
  cyan:          "#33c2c1"
  white:         "#adadad"
  bright-black:  "#555555"
  bright-red:    "#fb7172"
  bright-green:  "#67ff4f"
  bright-yellow: "#ffff00"
  bright-blue:   "#6d9df1"
  bright-magenta: "#fb82ff"
  bright-cyan:   "#60d3d1"
  bright-white:  "#eeeeee"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
