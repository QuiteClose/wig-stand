meta:
  name: GitHub Light High Contrast
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/GitHub%20Light%20High%20Contrast.toml"

palette:
  background:    "#ffffff"
  foreground:    "#0e1116"
  black:         "#0e1116"
  red:           "#a0111f"
  green:         "#024c1a"
  yellow:        "#3f2200"
  blue:          "#0349b4"
  magenta:       "#622cbc"
  cyan:          "#1b7c83"
  white:         "#66707b"
  bright-black:  "#4b535d"
  bright-red:    "#86061d"
  bright-green:  "#055d20"
  bright-yellow: "#4e2c00"
  bright-blue:   "#1168e3"
  bright-magenta: "#844ae7"
  bright-cyan:   "#3192aa"
  bright-white:  "#88929d"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
