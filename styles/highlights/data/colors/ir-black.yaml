meta:
  name: IR Black
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/IR%20Black.toml"

palette:
  background:    "#000000"
  foreground:    "#f1f1f1"
  black:         "#4f4f4f"
  red:           "#fa6c60"
  green:         "#a8ff60"
  yellow:        "#fffeb7"
  blue:          "#96cafe"
  magenta:       "#fa73fd"
  cyan:          "#c6c5fe"
  white:         "#efedef"
  bright-black:  "#7b7b7b"
  bright-red:    "#fcb6b0"
  bright-green:  "#cfffab"
  bright-yellow: "#ffffcc"
  bright-blue:   "#b5dcff"
  bright-magenta: "#fb9cfe"
  bright-cyan:   "#e0e0fe"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
