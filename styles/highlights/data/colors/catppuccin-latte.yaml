meta:
  name: Catppuccin Latte
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Catppuccin%20Latte.toml"

palette:
  background:    "#eff1f5"
  foreground:    "#4c4f69"
  black:         "#5c5f77"
  red:           "#d20f39"
  green:         "#40a02b"
  yellow:        "#df8e1d"
  blue:          "#1e66f5"
  magenta:       "#ea76cb"
  cyan:          "#179299"
  white:         "#acb0be"
  bright-black:  "#6c6f85"
  bright-red:    "#de293e"
  bright-green:  "#49af3d"
  bright-yellow: "#eea02d"
  bright-blue:   "#456eff"
  bright-magenta: "#fe85d8"
  bright-cyan:   "#2d9fa8"
  bright-white:  "#bcc0cc"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
