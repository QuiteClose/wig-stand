meta:
  name: 3024 Day
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/3024%20Day.toml"

palette:
  background:    "#f7f7f7"
  foreground:    "#4a4543"
  black:         "#090300"
  red:           "#db2d20"
  green:         "#01a252"
  yellow:        "#caba00"
  blue:          "#01a0e4"
  magenta:       "#a16a94"
  cyan:          "#8fbece"
  white:         "#a5a2a2"
  bright-black:  "#5c5855"
  bright-red:    "#dbaec3"
  bright-green:  "#3a3432"
  bright-yellow: "#4a4543"
  bright-blue:   "#807d7c"
  bright-magenta: "#bcbbba"
  bright-cyan:   "#cdab53"
  bright-white:  "#f7f7f7"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
