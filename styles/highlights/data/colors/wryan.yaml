meta:
  name: Wryan
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Wryan.toml"

palette:
  background:    "#101010"
  foreground:    "#999993"
  black:         "#333333"
  red:           "#8c4665"
  green:         "#287373"
  yellow:        "#7c7c99"
  blue:          "#395573"
  magenta:       "#5e468c"
  cyan:          "#31658c"
  white:         "#899ca1"
  bright-black:  "#3d3d3d"
  bright-red:    "#bf4d80"
  bright-green:  "#53a6a6"
  bright-yellow: "#9e9ecb"
  bright-blue:   "#477ab3"
  bright-magenta: "#7e62b3"
  bright-cyan:   "#6096bf"
  bright-white:  "#c0c0c0"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
