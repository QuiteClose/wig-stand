meta:
  name: Selenized Black
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Selenized%20Black.toml"

palette:
  background:    "#181818"
  foreground:    "#b9b9b9"
  black:         "#252525"
  red:           "#ed4a46"
  green:         "#70b433"
  yellow:        "#dbb32d"
  blue:          "#368aeb"
  magenta:       "#eb6eb7"
  cyan:          "#3fc5b7"
  white:         "#b9b9b9"
  bright-black:  "#777777"
  bright-red:    "#ff5e56"
  bright-green:  "#83c746"
  bright-yellow: "#efc541"
  bright-blue:   "#4f9cfe"
  bright-magenta: "#ff81ca"
  bright-cyan:   "#56d8c9"
  bright-white:  "#dedede"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
