meta:
  name: Flatland
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Flatland.toml"

palette:
  background:    "#1d1f21"
  foreground:    "#b8dbef"
  black:         "#1d1d19"
  red:           "#f18339"
  green:         "#9fd364"
  yellow:        "#f4ef6d"
  blue:          "#5096be"
  magenta:       "#695abc"
  cyan:          "#d63865"
  white:         "#ffffff"
  bright-black:  "#50504c"
  bright-red:    "#d22a24"
  bright-green:  "#a7d42c"
  bright-yellow: "#ff8949"
  bright-blue:   "#61b9d0"
  bright-magenta: "#695abc"
  bright-cyan:   "#d63865"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
