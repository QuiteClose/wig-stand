meta:
  name: Black Metal (Mayhem)
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Black%20Metal%20%28Mayhem%29.toml"

palette:
  background:    "#000000"
  foreground:    "#c1c1c1"
  black:         "#000000"
  red:           "#5f8787"
  green:         "#f3ecd4"
  yellow:        "#eecc6c"
  blue:          "#888888"
  magenta:       "#999999"
  cyan:          "#aaaaaa"
  white:         "#c1c1c1"
  bright-black:  "#404040"
  bright-red:    "#5f8787"
  bright-green:  "#f3ecd4"
  bright-yellow: "#eecc6c"
  bright-blue:   "#888888"
  bright-magenta: "#999999"
  bright-cyan:   "#aaaaaa"
  bright-white:  "#c1c1c1"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
