meta:
  name: Paul Millr
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Paul%20Millr.toml"

palette:
  background:    "#000000"
  foreground:    "#f2f2f2"
  black:         "#2a2a2a"
  red:           "#ff0000"
  green:         "#79ff0f"
  yellow:        "#e7bf00"
  blue:          "#396bd7"
  magenta:       "#b449be"
  cyan:          "#66ccff"
  white:         "#bbbbbb"
  bright-black:  "#666666"
  bright-red:    "#ff0080"
  bright-green:  "#66ff66"
  bright-yellow: "#f3d64e"
  bright-blue:   "#709aed"
  bright-magenta: "#db67e6"
  bright-cyan:   "#7adff2"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
