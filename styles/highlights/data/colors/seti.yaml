meta:
  name: Seti
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Seti.toml"

palette:
  background:    "#111213"
  foreground:    "#cacecd"
  black:         "#323232"
  red:           "#c22832"
  green:         "#8ec43d"
  yellow:        "#e0c64f"
  blue:          "#43a5d5"
  magenta:       "#8b57b5"
  cyan:          "#8ec43d"
  white:         "#eeeeee"
  bright-black:  "#3f3f3f"
  bright-red:    "#c22832"
  bright-green:  "#8ec43d"
  bright-yellow: "#e0c64f"
  bright-blue:   "#43a5d5"
  bright-magenta: "#8b57b5"
  bright-cyan:   "#8ec43d"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
