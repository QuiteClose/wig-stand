meta:
  name: No Clown Fiesta
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/No%20Clown%20Fiesta.toml"

palette:
  background:    "#101010"
  foreground:    "#e0e1e4"
  black:         "#151515"
  red:           "#b46958"
  green:         "#90a959"
  yellow:        "#f4bf75"
  blue:          "#bad7ff"
  magenta:       "#aa759f"
  cyan:          "#88afa2"
  white:         "#e1e1e1"
  bright-black:  "#727272"
  bright-red:    "#7e97ab"
  bright-green:  "#90a959"
  bright-yellow: "#f4bf75"
  bright-blue:   "#bad7ff"
  bright-magenta: "#aa759f"
  bright-cyan:   "#88afa2"
  bright-white:  "#afafaf"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
