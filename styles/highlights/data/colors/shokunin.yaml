meta:
  name: Shokunin
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Shokunin.toml"

palette:
  background:    "#fcfaf2"
  foreground:    "#303841"
  black:         "#303841"
  red:           "#c84053"
  green:         "#157a5b"
  yellow:        "#9a6000"
  blue:          "#006fae"
  magenta:       "#8f4155"
  cyan:          "#006c7f"
  white:         "#c2beb4"
  bright-black:  "#777269"
  bright-red:    "#d95a66"
  bright-green:  "#1b8e6a"
  bright-yellow: "#b67608"
  bright-blue:   "#0084c7"
  bright-magenta: "#a75b73"
  bright-cyan:   "#008396"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
