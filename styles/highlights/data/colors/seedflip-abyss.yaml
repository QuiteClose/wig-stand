meta:
  name: SeedFlip Abyss
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/SeedFlip%20Abyss.toml"

palette:
  background:    "#050510"
  foreground:    "#e0e0f0"
  black:         "#030308"
  red:           "#d26060"
  green:         "#60d286"
  yellow:        "#d2bf60"
  blue:          "#6090d2"
  magenta:       "#d260d2"
  cyan:          "#60d2d2"
  white:         "#f1f1f8"
  bright-black:  "#3d3d70"
  bright-red:    "#e39c9c"
  bright-green:  "#9ce3b3"
  bright-yellow: "#e3d79c"
  bright-blue:   "#9cb9e3"
  bright-magenta: "#e39ce3"
  bright-cyan:   "#9ce3e3"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
