meta:
  name: Paraiso Dark
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Paraiso%20Dark.toml"

palette:
  background:    "#2f1e2e"
  foreground:    "#a39e9b"
  black:         "#2f1e2e"
  red:           "#ef6155"
  green:         "#48b685"
  yellow:        "#fec418"
  blue:          "#06b6ef"
  magenta:       "#815ba4"
  cyan:          "#5bc4bf"
  white:         "#a39e9b"
  bright-black:  "#776e71"
  bright-red:    "#ef6155"
  bright-green:  "#48b685"
  bright-yellow: "#fec418"
  bright-blue:   "#06b6ef"
  bright-magenta: "#815ba4"
  bright-cyan:   "#5bc4bf"
  bright-white:  "#e7e9db"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
