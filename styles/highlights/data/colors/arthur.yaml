meta:
  name: Arthur
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Arthur.toml"

palette:
  background:    "#1c1c1c"
  foreground:    "#ddeedd"
  black:         "#3d352a"
  red:           "#cd5c5c"
  green:         "#86af80"
  yellow:        "#e8ae5b"
  blue:          "#6495ed"
  magenta:       "#deb887"
  cyan:          "#b0c4de"
  white:         "#bbaa99"
  bright-black:  "#554444"
  bright-red:    "#cc5533"
  bright-green:  "#88aa22"
  bright-yellow: "#ffa75d"
  bright-blue:   "#87ceeb"
  bright-magenta: "#996600"
  bright-cyan:   "#b0c4de"
  bright-white:  "#ddccbb"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
