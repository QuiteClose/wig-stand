meta:
  name: Sleepy Hollow
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Sleepy%20Hollow.toml"

palette:
  background:    "#121214"
  foreground:    "#af9a91"
  black:         "#572100"
  red:           "#ba3934"
  green:         "#91773f"
  yellow:        "#b55600"
  blue:          "#5f63b4"
  magenta:       "#a17c7b"
  cyan:          "#8faea9"
  white:         "#af9a91"
  bright-black:  "#4e4b61"
  bright-red:    "#d9443f"
  bright-green:  "#d6b04e"
  bright-yellow: "#f66813"
  bright-blue:   "#8086ef"
  bright-magenta: "#e2c2bb"
  bright-cyan:   "#a4dce7"
  bright-white:  "#d2c7a9"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
