meta:
  name: Dark+
palette:
  background:    "#1e1e1e"
  foreground:    "#cccccc"
  black:         "#000000"
  red:           "#cd3131"
  green:         "#0dbc79"
  yellow:        "#e5e510"
  blue:          "#2472c8"
  magenta:       "#bc3fbc"
  cyan:          "#11a8cd"
  white:         "#e5e5e5"
  bright-black:  "#666666"
  bright-red:    "#f14c4c"
  bright-green:  "#23d18b"
  bright-yellow: "#f5f543"
  bright-blue:   "#3b8eea"
  bright-magenta: "#d670d6"
  bright-cyan:   "#29b8db"
  bright-white:  "#e5e5e5"
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
