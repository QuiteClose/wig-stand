meta:
  name: Melange Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Melange%20Light.toml"

palette:
  background:    "#f1f1f1"
  foreground:    "#54433a"
  black:         "#e9e1db"
  red:           "#c77b8b"
  green:         "#6e9b72"
  yellow:        "#bc5c00"
  blue:          "#7892bd"
  magenta:       "#be79bb"
  cyan:          "#739797"
  white:         "#7d6658"
  bright-black:  "#a98a78"
  bright-red:    "#bf0021"
  bright-green:  "#3a684a"
  bright-yellow: "#a06d00"
  bright-blue:   "#465aa4"
  bright-magenta: "#904180"
  bright-cyan:   "#3d6568"
  bright-white:  "#54433a"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
