meta:
  name: Midnight In Mojave
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Midnight%20In%20Mojave.toml"

palette:
  background:    "#1e1e1e"
  foreground:    "#ffffff"
  black:         "#1e1e1e"
  red:           "#ff453a"
  green:         "#32d74b"
  yellow:        "#ffd60a"
  blue:          "#0a84ff"
  magenta:       "#bf5af2"
  cyan:          "#5ac8fa"
  white:         "#ffffff"
  bright-black:  "#515151"
  bright-red:    "#ff453a"
  bright-green:  "#32d74b"
  bright-yellow: "#ffd60a"
  bright-blue:   "#0a84ff"
  bright-magenta: "#bf5af2"
  bright-cyan:   "#5ac8fa"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
