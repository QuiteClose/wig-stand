meta:
  name: Fahrenheit
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Fahrenheit.toml"

palette:
  background:    "#000000"
  foreground:    "#ffffce"
  black:         "#1d1d1d"
  red:           "#cda074"
  green:         "#9e744d"
  yellow:        "#fecf75"
  blue:          "#7f0e0f"
  magenta:       "#734c4d"
  cyan:          "#979797"
  white:         "#ffffce"
  bright-black:  "#404040"
  bright-red:    "#fecea0"
  bright-green:  "#cc734d"
  bright-yellow: "#fd9f4d"
  bright-blue:   "#cb4a05"
  bright-magenta: "#4e739f"
  bright-cyan:   "#fed04d"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
