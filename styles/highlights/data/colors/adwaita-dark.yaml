meta:
  name: Adwaita Dark
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Adwaita%20Dark.toml"

palette:
  background:    "#1d1d20"
  foreground:    "#ffffff"
  black:         "#241f31"
  red:           "#c01c28"
  green:         "#2ec27e"
  yellow:        "#f5c211"
  blue:          "#1e78e4"
  magenta:       "#9841bb"
  cyan:          "#0ab9dc"
  white:         "#c0bfbc"
  bright-black:  "#5e5c64"
  bright-red:    "#ed333b"
  bright-green:  "#57e389"
  bright-yellow: "#f8e45c"
  bright-blue:   "#51a1ff"
  bright-magenta: "#c061cb"
  bright-cyan:   "#4fd2fd"
  bright-white:  "#f6f5f4"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
