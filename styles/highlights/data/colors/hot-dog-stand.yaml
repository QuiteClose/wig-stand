meta:
  name: Hot Dog Stand
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Hot%20Dog%20Stand.toml"

palette:
  background:    "#ea3323"
  foreground:    "#ffffff"
  black:         "#000000"
  red:           "#ffff54"
  green:         "#ffff54"
  yellow:        "#ffff54"
  blue:          "#000000"
  magenta:       "#ffff54"
  cyan:          "#ffffff"
  white:         "#c6c6c6"
  bright-black:  "#000000"
  bright-red:    "#ffff54"
  bright-green:  "#ffff54"
  bright-yellow: "#ffff54"
  bright-blue:   "#000000"
  bright-magenta: "#ffff54"
  bright-cyan:   "#ffffff"
  bright-white:  "#c6c6c6"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
