meta:
  name: Seoulbones Dark
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Seoulbones%20Dark.toml"

palette:
  background:    "#4b4b4b"
  foreground:    "#dddddd"
  black:         "#4b4b4b"
  red:           "#e388a3"
  green:         "#98bd99"
  yellow:        "#ffdf9b"
  blue:          "#97bdde"
  magenta:       "#a5a6c5"
  cyan:          "#6fbdbe"
  white:         "#dddddd"
  bright-black:  "#797172"
  bright-red:    "#eb99b1"
  bright-green:  "#8fcd92"
  bright-yellow: "#ffe5b3"
  bright-blue:   "#a2c8e9"
  bright-magenta: "#b2b3da"
  bright-cyan:   "#6bcacb"
  bright-white:  "#a8a8a8"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
