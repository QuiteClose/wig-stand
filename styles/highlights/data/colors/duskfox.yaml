meta:
  name: Duskfox
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Duskfox.toml"

palette:
  background:    "#232136"
  foreground:    "#e0def4"
  black:         "#393552"
  red:           "#eb6f92"
  green:         "#a3be8c"
  yellow:        "#f6c177"
  blue:          "#569fba"
  magenta:       "#c4a7e7"
  cyan:          "#9ccfd8"
  white:         "#e0def4"
  bright-black:  "#544d8a"
  bright-red:    "#f083a2"
  bright-green:  "#b1d196"
  bright-yellow: "#f9cb8c"
  bright-blue:   "#65b1cd"
  bright-magenta: "#ccb1ed"
  bright-cyan:   "#a6dae3"
  bright-white:  "#e2e0f7"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
