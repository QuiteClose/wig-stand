meta:
  name: Man Page
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Man%20Page.toml"

palette:
  background:    "#fef49c"
  foreground:    "#000000"
  black:         "#000000"
  red:           "#cc0000"
  green:         "#00a600"
  yellow:        "#999900"
  blue:          "#0000b2"
  magenta:       "#b200b2"
  cyan:          "#00a6b2"
  white:         "#b2b2b2"
  bright-black:  "#666666"
  bright-red:    "#e50000"
  bright-green:  "#00cc00"
  bright-yellow: "#bfbf00"
  bright-blue:   "#0000ff"
  bright-magenta: "#e500e5"
  bright-cyan:   "#00cbcb"
  bright-white:  "#e5e5e5"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
