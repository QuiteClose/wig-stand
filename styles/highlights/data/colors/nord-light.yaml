meta:
  name: Nord Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Nord%20Light.toml"

palette:
  background:    "#e5e9f0"
  foreground:    "#414858"
  black:         "#3b4252"
  red:           "#bf616a"
  green:         "#96b17f"
  yellow:        "#c5a565"
  blue:          "#81a1c1"
  magenta:       "#b48ead"
  cyan:          "#7bb3c3"
  white:         "#a5abb6"
  bright-black:  "#4c566a"
  bright-red:    "#bf616a"
  bright-green:  "#96b17f"
  bright-yellow: "#c5a565"
  bright-blue:   "#81a1c1"
  bright-magenta: "#b48ead"
  bright-cyan:   "#82afae"
  bright-white:  "#eceff4"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
