meta:
  name: iTerm2 Solarized Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/iTerm2%20Solarized%20Light.toml"

palette:
  background:    "#fdf6e3"
  foreground:    "#657b83"
  black:         "#073642"
  red:           "#dc322f"
  green:         "#859900"
  yellow:        "#b58900"
  blue:          "#268bd2"
  magenta:       "#d33682"
  cyan:          "#2aa198"
  white:         "#bbb5a2"
  bright-black:  "#002b36"
  bright-red:    "#cb4b16"
  bright-green:  "#586e75"
  bright-yellow: "#657b83"
  bright-blue:   "#839496"
  bright-magenta: "#6c71c4"
  bright-cyan:   "#93a1a1"
  bright-white:  "#fdf6e3"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
