meta:
  name: Bluloco Dark
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Bluloco%20Dark.toml"

palette:
  background:    "#282c34"
  foreground:    "#b9c0cb"
  black:         "#41444d"
  red:           "#fc2f52"
  green:         "#25a45c"
  yellow:        "#ff936a"
  blue:          "#3476ff"
  magenta:       "#7a82da"
  cyan:          "#4483aa"
  white:         "#cdd4e0"
  bright-black:  "#8f9aae"
  bright-red:    "#ff6480"
  bright-green:  "#3fc56b"
  bright-yellow: "#f9c859"
  bright-blue:   "#10b1fe"
  bright-magenta: "#ff78f8"
  bright-cyan:   "#5fb9bc"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
