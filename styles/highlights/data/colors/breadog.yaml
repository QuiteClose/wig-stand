meta:
  name: Breadog
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Breadog.toml"

palette:
  background:    "#f1ebe6"
  foreground:    "#362c24"
  black:         "#362c24"
  red:           "#b10b00"
  green:         "#007232"
  yellow:        "#8b4c00"
  blue:          "#005cb4"
  magenta:       "#9b0097"
  cyan:          "#006a78"
  white:         "#baa99d"
  bright-black:  "#514337"
  bright-red:    "#de1100"
  bright-green:  "#008f40"
  bright-yellow: "#ae6000"
  bright-blue:   "#0074e1"
  bright-magenta: "#c300bd"
  bright-cyan:   "#008697"
  bright-white:  "#eae1da"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
