meta:
  name: Karma Light
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Karma%20Light.toml"

palette:
  background:    "#ffffff"
  foreground:    "#0a0e14"
  black:         "#0a0e14"
  red:           "#fc618d"
  green:         "#2d972f"
  yellow:        "#eeae11"
  blue:          "#5688c7"
  magenta:       "#6f42c1"
  cyan:          "#5688c7"
  white:         "#525053"
  bright-black:  "#999999"
  bright-red:    "#fc618d"
  bright-green:  "#2d972f"
  bright-yellow: "#ffaa33"
  bright-blue:   "#5688c7"
  bright-magenta: "#a86efd"
  bright-cyan:   "#5688c7"
  bright-white:  "#0a0e14"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
