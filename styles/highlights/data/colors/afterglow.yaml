meta:
  name: Afterglow
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Afterglow.toml"

palette:
  background:    "#212121"
  foreground:    "#d0d0d0"
  black:         "#151515"
  red:           "#ac4142"
  green:         "#7e8e50"
  yellow:        "#e5b567"
  blue:          "#6c99bb"
  magenta:       "#9f4e85"
  cyan:          "#7dd6cf"
  white:         "#d0d0d0"
  bright-black:  "#505050"
  bright-red:    "#ac4142"
  bright-green:  "#7e8e50"
  bright-yellow: "#e5b567"
  bright-blue:   "#6c99bb"
  bright-magenta: "#9f4e85"
  bright-cyan:   "#7dd6cf"
  bright-white:  "#f5f5f5"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
