meta:
  name: Tango Half Adapted
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Tango%20Half%20Adapted.toml"

palette:
  background:    "#ffffff"
  foreground:    "#000000"
  black:         "#000000"
  red:           "#ff0000"
  green:         "#4cc300"
  yellow:        "#e2c000"
  blue:          "#008ef6"
  magenta:       "#a96cb3"
  cyan:          "#00bdc3"
  white:         "#babfb5"
  bright-black:  "#797d76"
  bright-red:    "#ff0013"
  bright-green:  "#70dc00"
  bright-yellow: "#d9c600"
  bright-blue:   "#76bfff"
  bright-magenta: "#d898d1"
  bright-cyan:   "#00d0d4"
  bright-white:  "#f4f4f2"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
