meta:
  name: Chalk
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Chalk.toml"

palette:
  background:    "#2b2d2e"
  foreground:    "#d2d8d9"
  black:         "#7d8b8f"
  red:           "#b23a52"
  green:         "#789b6a"
  yellow:        "#b9ac4a"
  blue:          "#2a7fac"
  magenta:       "#bd4f5a"
  cyan:          "#44a799"
  white:         "#d2d8d9"
  bright-black:  "#888888"
  bright-red:    "#f24840"
  bright-green:  "#80c470"
  bright-yellow: "#ffeb62"
  bright-blue:   "#4196ff"
  bright-magenta: "#fc5275"
  bright-cyan:   "#53cdbd"
  bright-white:  "#d2d8d9"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
