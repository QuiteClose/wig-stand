meta:
  name: Aura
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Aura.toml"

palette:
  background:    "#15141b"
  foreground:    "#edecee"
  black:         "#110f18"
  red:           "#ff6767"
  green:         "#61ffca"
  yellow:        "#ffca85"
  blue:          "#a277ff"
  magenta:       "#a277ff"
  cyan:          "#61ffca"
  white:         "#edecee"
  bright-black:  "#4d4d4d"
  bright-red:    "#ffca85"
  bright-green:  "#a277ff"
  bright-yellow: "#ffca85"
  bright-blue:   "#a277ff"
  bright-magenta: "#a277ff"
  bright-cyan:   "#61ffca"
  bright-white:  "#edecee"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
