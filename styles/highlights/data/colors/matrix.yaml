meta:
  name: Matrix
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Matrix.toml"

palette:
  background:    "#0f191c"
  foreground:    "#426644"
  black:         "#0f191c"
  red:           "#23755a"
  green:         "#82d967"
  yellow:        "#ffd700"
  blue:          "#3f5242"
  magenta:       "#409931"
  cyan:          "#50b45a"
  white:         "#507350"
  bright-black:  "#688060"
  bright-red:    "#2fc079"
  bright-green:  "#90d762"
  bright-yellow: "#faff00"
  bright-blue:   "#4f7e7e"
  bright-magenta: "#11ff25"
  bright-cyan:   "#c1ff8a"
  bright-white:  "#678c61"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
