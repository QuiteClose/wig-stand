meta:
  name: Material Design Colors
  origin: "https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/Material%20Design%20Colors.toml"

palette:
  background:    "#1d262a"
  foreground:    "#e7ebed"
  black:         "#435b67"
  red:           "#fc3841"
  green:         "#5cf19e"
  yellow:        "#fed032"
  blue:          "#37b6ff"
  magenta:       "#fc226e"
  cyan:          "#59ffd1"
  white:         "#ffffff"
  bright-black:  "#a1b0b8"
  bright-red:    "#fc746d"
  bright-green:  "#adf7be"
  bright-yellow: "#fee16c"
  bright-blue:   "#70cfff"
  bright-magenta: "#fc669b"
  bright-cyan:   "#9affe6"
  bright-white:  "#ffffff"
terminal:
  background:    background
  foreground:    foreground
  black:         black
  red:           red
  green:         green
  yellow:        yellow
  blue:          blue
  magenta:       magenta
  cyan:          cyan
  white:         white
  bright-black:  bright-black
  bright-red:    bright-red
  bright-green:  bright-green
  bright-yellow: bright-yellow
  bright-blue:   bright-blue
  bright-magenta: bright-magenta
  bright-cyan:   bright-cyan
  bright-white:  bright-white
document:
  text:
    primary:   foreground
    secondary: bright-black
    emphasis:  bright-white
    heading:   foreground
    link:      blue
  background:
    primary:   background
    secondary: black
    embed:     bright-black
syntax:
  variable:    magenta
  constant:    bright-magenta
  punctuation: bright-black
  operator:    white
  number:      yellow
  type:        cyan
  function:    blue
  string:      green
  comment:     bright-black
  keyword:     red
