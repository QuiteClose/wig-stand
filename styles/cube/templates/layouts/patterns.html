<t-extend template="cube:layouts/base.html">
<t-define name="head">
<link rel="stylesheet" t-var:href="document.style.css.path" />
<link rel="stylesheet" href="/assets/styles/cube/pattern-library.css" />
</t-define>
<t-define name="body">
<div class="pattern-library">
<nav class="pattern-nav" aria-label="Pattern categories">
<a href="#library" class="pattern-nav-library" aria-current="page" data-library>Library</a>
<t-if var="document.style.patterns.tokens.items">
<h2>Tokens</h2>
<ul>
<t-for p in document.style.patterns.tokens.items>
<t-let name="purl"><t-var name="site.path" />patterns/<t-var name="p.slug" />/</t-let>
<li><a t-var:href="purl" target="pattern-preview"><t-var name="p.name" /></a></li>
</t-for>
</ul>
</t-if>
<t-if var="document.style.patterns.resets.items">
<h2>Resets</h2>

</t-if>

<h2>Utilities</h2>

</nav>
<main id="main-content" class="pattern-content">
<div class="pattern-viewport-controls">
<button type="button" data-width="320" aria-label="Mobile viewport">Mobile</button>
<button type="button" data-width="768" aria-label="Tablet viewport">Tablet</button>
<button type="button" data-width="1024" aria-label="Desktop viewport">Desktop</button>
<button type="button" data-width="100%" aria-label="Full width viewport" class="active">Full</button>
</div>
<div id="library" class="pattern-overview prose active"><t-slot /></div>
<iframe name="pattern-preview" class="pattern-preview-frame" title="Pattern preview"></iframe>
</main>
</div>
<script>
(function() {
  var overview = document.querySelector('.pattern-overview');
  var frame = document.querySelector('.pattern-preview-frame');
  var controls = document.querySelector('.pattern-viewport-controls');
  var libraryLink = document.querySelector('[data-library]');
  var patternLinks = document.querySelectorAll('.pattern-nav a[target="pattern-preview"]');

  function clearNavCurrent() {
    libraryLink.removeAttribute('aria-current');
    patternLinks.forEach(function(l) { l.removeAttribute('aria-current'); });
  }

  function showOverview(e) {
    if (e) e.preventDefault();
    overview.classList.add('active');
    frame.classList.remove('active');
    controls.classList.remove('active');
    clearNavCurrent();
    libraryLink.setAttribute('aria-current', 'page');
  }

  function showPattern(link) {
    overview.classList.remove('active');
    frame.classList.add('active');
    controls.classList.add('active');
    clearNavCurrent();
    link.setAttribute('aria-current', 'page');
    link.scrollIntoView({ block: 'nearest' });
  }

  libraryLink.addEventListener('click', showOverview);
  patternLinks.forEach(function(link) {
    link.addEventListener('click', function() { showPattern(link); });
  });

  var buttons = document.querySelectorAll('.pattern-viewport-controls button');
  buttons.forEach(function(btn) {
    btn.addEventListener('click', function() {
      buttons.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var w = btn.getAttribute('data-width');
      frame.style.maxWidth = w === '100%' ? 'none' : w + 'px';
    });
  });
})();
</script>
</t-define>
</t-extend>
